name: P1 A2A server gate

# P1-01 (issue #83): the standalone A2A validation service
# (services/a2a-server, fully isolated package — docs/adr/0013) must
# frozen-install, typecheck and pass its protocol suite on a clean Linux
# runner: official @a2a-js/sdk client round-trip (Agent Card discovery,
# blocking/streaming send, GetTask, CancelTask), standard error mapping
# (fixtures 05–12 semantics), SSE-disconnect-never-cancels, Task-only
# policy, auth/param failures never create tasks. Since P1-11 (issue #111)
# the same gate also runs the official PYTHON client interop probe
# (a2a-sdk==1.2.3 via setup-python, two runtime rounds: synthetic +
# dsh-worker) against the real subprocess server. Synthetic data only;
# loopback only; no DATABASE_URL and no provider credentials by design.
#
# The root-level static guard (tests/server/a2a-server-skeleton.spec.ts)
# is covered by the r1-baseline-gate suite; this workflow owns the
# executable protocol evidence of the isolated package.
on:
  pull_request:
    paths:
      - 'services/a2a-server/**'
      - 'services/dsh-a2a-client/**'
      - '.github/workflows/p1-a2a-server-gate.yml'
  push:
    branches: [main]
    paths:
      - 'services/a2a-server/**'
      - 'services/dsh-a2a-client/**'
      - '.github/workflows/p1-a2a-server-gate.yml'
  workflow_dispatch:

# Minimal token: the gate only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: p1-a2a-server-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pinned toolchain as the R0/R1 gates (isolated package installs with
  # its own lockfile; lockfileVersion 9.0 is compatible with this pnpm pin).
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '10.34.7'
  CI: 'true'

jobs:
  a2a-server:
    name: A2A validation service (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_node="$(node --version)"
          actual_pnpm="$(pnpm --version)"
          echo "node=${actual_node} pnpm=${actual_pnpm}"
          [ "${actual_node}" = "v${NODE_VERSION}" ]
          [ "${actual_pnpm}" = "${PNPM_VERSION}" ]

      - name: Prove the clean-environment contract (no real credentials/data)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL must stay unset in the A2A server gate"
            exit 1
          fi
          for key in DEEPSEEK_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "::error::${key} must stay unset in the A2A server gate"
              exit 1
            fi
          done
          echo "clean environment confirmed"

      - name: Frozen-lockfile install (isolated package)
        working-directory: services/a2a-server
        run: pnpm install --frozen-lockfile

      - name: Install exact Python 3.12 (official a2a-sdk interop probe, P1-11/#111)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the locked official Python SDK (a2a-sdk==1.2.3)
        run: python -m pip install --disable-pip-version-check a2a-sdk==1.2.3

      - name: Typecheck (isolated tsconfig)
        working-directory: services/a2a-server
        run: pnpm run typecheck

      - name: Protocol suite (official SDK client round-trip, errors, SSE, contracts)
        working-directory: services/a2a-server
        run: pnpm test

  # P2-02 (issue #114): the DSH A2A Client (services/dsh-a2a-client, the
  # second isolated package — ADR-0013 precedent, ADR-0018 Appendix B) must
  # frozen-install, typecheck and pass its unit/contract suite PLUS the
  # real-link integration suite (it spawns the REAL a2a-server entry from
  # the sibling package in dsh-worker mode with file SQLite and a synthetic
  # two-credential bootstrap). Installation surfaces stay separate: each
  # isolated package installs from its own lockfile in its own directory.
  dsh-a2a-client:
    name: DSH A2A client gate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_node="$(node --version)"
          actual_pnpm="$(pnpm --version)"
          echo "node=${actual_node} pnpm=${actual_pnpm}"
          [ "${actual_node}" = "v${NODE_VERSION}" ]
          [ "${actual_pnpm}" = "${PNPM_VERSION}" ]

      - name: Prove the clean-environment contract (no real credentials/data)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL must stay unset in the DSH A2A client gate"
            exit 1
          fi
          for key in DEEPSEEK_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "::error::${key} must stay unset in the DSH A2A client gate"
              exit 1
            fi
          done
          echo "clean environment confirmed"

      - name: Frozen-lockfile install (a2a-server, integration target)
        working-directory: services/a2a-server
        run: pnpm install --frozen-lockfile

      - name: Frozen-lockfile install (dsh-a2a-client, isolated package)
        working-directory: services/dsh-a2a-client
        run: pnpm install --frozen-lockfile

      - name: Typecheck (isolated tsconfig)
        working-directory: services/dsh-a2a-client
        run: pnpm run typecheck

      - name: Unit/contract suite (in-process mock, ADR-0018 Appendix A methodology)
        working-directory: services/dsh-a2a-client
        run: pnpm test

      - name: Real-link integration suite (real a2a-server + dsh-worker subprocesses)
        working-directory: services/dsh-a2a-client
        run: pnpm run test:integration
