name: E2E-04 xiaozhi deployment gate

# E2E-04 (issue #54): the pinned xiaozhi-esp32-server private deployment must be
# provable on a clean Linux runner WITHOUT claiming real-device readiness
# (#E2E-08 owns device acceptance). Two jobs:
#   1. artifacts — syntax + template/pin integrity of deploy/xiaozhi/**;
#   2. deployment-smoke — bootstrap the pinned commit from scratch
#      (clone-by-SHA -> venv -> gateway-minimal deps -> rendered config),
#      boot it, and prove: OTA grant, loopback-only binding, simulated-device
#      hello ack + abort->tts stop, auth refusal negative, silent binary drop
#      negative, restart recovery, corrupted-config fail-fast negative.
# No real credentials, no real device, no external egress: the gateway-minimal
# profile configures no ASR/LLM/TTS providers at all.
on:
  pull_request:
    paths:
      - 'deploy/xiaozhi/**'
      - 'tests/deploy/**'
      - 'lib/domain/voice/adapter/protocol.ts'
      - '.github/workflows/e2e-04-xiaozhi-deployment-gate.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/xiaozhi/**'
      - 'tests/deploy/**'
      - 'lib/domain/voice/adapter/protocol.ts'
      - '.github/workflows/e2e-04-xiaozhi-deployment-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-04-xiaozhi-deployment-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  artifacts:
    name: Deployment artifacts (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell scripts pass bash -n
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/xiaozhi/*.sh; do
            bash -n "${script}"
            echo "bash -n OK: ${script}"
          done

      - name: Python scripts compile
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/xiaozhi/*.py; do
            python3 -m py_compile "${script}"
            echo "py_compile OK: ${script}"
          done

      - name: systemd unit passes systemd-analyze verify
        shell: bash
        run: |
          set -euo pipefail
          # Same arbitration as r1-deployment-gate.yml (issue #20): the grep —
          # not the exit code — decides; missing ExecStart binary / service
          # user are deploy-host facts, silent verify output is a hard failure.
          systemd-analyze verify deploy/xiaozhi/xiaozhi-server.service 2>&1 | tee /tmp/unit-verify.log || true
          if [ ! -s /tmp/unit-verify.log ]; then
            echo "::error::systemd-analyze verify produced no output; cannot arbitrate"
            exit 1
          fi
          if grep -qE 'Failed to parse|Failed to load|Refusing|Unknown key name' /tmp/unit-verify.log; then
            echo "::error::systemd unit has parse errors"
            grep -E 'Failed to parse|Failed to load|Refusing|Unknown key name' /tmp/unit-verify.log
            exit 1
          fi
          echo "unit syntax OK"

      - name: Config template parses as YAML and stays loopback-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          cfg = yaml.safe_load(open("deploy/xiaozhi/config/gateway-minimal.yaml", encoding="utf-8"))
          server = cfg["server"]
          assert server["ip"] == "127.0.0.1", server["ip"]
          assert server["auth"]["enabled"] is True
          assert server["auth"]["allowed_devices"] == []
          assert set(cfg["selected_module"].keys()) == {"VAD"}, cfg["selected_module"]
          print("gateway-minimal template OK (loopback, auth on, VAD only)")
          PY

      - name: Env template carries no real secrets
        shell: bash
        run: |
          set -euo pipefail
          # Same discipline as r1-deployment-gate.yml: every active value line
          # must be empty or a documented placeholder shape.
          if grep -E '^XIAOZHI_[A-Z_]+=.+' deploy/xiaozhi/env/gateway-minimal.example \
             | grep -vE '(<generate|xiaozhi\.example\.com)'; then
            echo "::error::env template must not carry real values"
            exit 1
          fi
          echo "template clean"

      - name: Minimal requirements are fully pinned (no floating refs)
        shell: bash
        run: |
          set -euo pipefail
          if grep -vE '^\s*(#|$)' deploy/xiaozhi/requirements-gateway-minimal.txt \
             | grep -vE '^[A-Za-z0-9_.-]+==[A-Za-z0-9.]+$'; then
            echo "::error::unpinned requirement line detected"
            exit 1
          fi
          echo "requirements-gateway-minimal.txt fully pinned"

      - name: Pinned version markers are single-sourced
        shell: bash
        run: |
          set -euo pipefail
          commit="$(grep -oP '(?<=^XIAOZHI_SERVER_COMMIT=)[0-9a-f]{40}$' deploy/xiaozhi/version.env)"
          [ "$(grep -c "${commit}" deploy/xiaozhi/version.env)" -ge 1 ]
          # protocol.ts baseline must agree with version.env (also asserted by
          # tests/deploy/xiaozhi-deployment.spec.ts in the Node suite).
          grep -q "main@${commit}" lib/domain/voice/adapter/protocol.ts
          echo "version pin single-sourced: ${commit:0:12}"

  deployment-smoke:
    name: xiaozhi clean-env deployment smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install + assert system deps (ffmpeg, libopus) — upstream runtime requirements
        shell: bash
        run: |
          set -euo pipefail
          # ffmpeg + libopus0 are genuine upstream runtime requirements
          # (app.py's check_ffmpeg_installed / opuslib_next's ctypes libopus);
          # hosted runners no longer ship ffmpeg, so install explicitly and
          # assert both before any deployment step.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libopus0
          ffmpeg -version | head -1
          python3 -c "import ctypes; ctypes.CDLL('libopus.so.0'); print('libopus OK')"

      - name: Generate smoke secrets (never committed, never echoed)
        shell: bash
        run: |
          set -euo pipefail
          echo "XIAOZHI_AUTH_KEY=$(openssl rand -hex 32)" > xiaozhi-smoke.env
          echo "XIAOZHI_DEVICE_WS_URL=ws://127.0.0.1:8000/xiaozhi/v1/" >> xiaozhi-smoke.env
          echo "XIAOZHI_PUBLIC_DOMAIN=127.0.0.1" >> xiaozhi-smoke.env
          chmod 600 xiaozhi-smoke.env

      - name: Bootstrap pinned server from scratch (clone-by-SHA, venv, minimal deps)
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/xiaozhi/bootstrap.sh \
            --target "$RUNNER_TEMP/xiaozhi-esp32-server" \
            --env-file "$(pwd)/xiaozhi-smoke.env"

      - name: Boot the gateway-minimal server (foreground, smoke env)
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$GITHUB_WORKSPACE/xiaozhi-smoke.env"; set +a
          cd "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server"
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" app.py > server1.log 2>&1 &
          echo $! > server.pid
          echo "started pid $(cat server.pid)"

      - name: Health check (OTA grant + loopback binding + hello/abort probe)
        shell: bash
        run: |
          set -euo pipefail
          # set -a: healthcheck.sh is a CHILD process — the sourced smoke env
          # must be EXPORTED or XIAOZHI_AUTH_KEY never reaches it.
          set -a; source xiaozhi-smoke.env; set +a
          XIAOZHI_PYTHON="$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" \
            bash deploy/xiaozhi/healthcheck.sh

      - name: Capture pre-restart session_id
        shell: bash
        run: |
          set -euo pipefail
          source xiaozhi-smoke.env
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" deploy/xiaozhi/probe_hello.py \
            --url ws://127.0.0.1:8000/xiaozhi/v1/ \
            --device-id aa:bb:cc:dd:ee:04 --client-id restart-probe --without-abort \
            --auth-key "${XIAOZHI_AUTH_KEY}" | tee session1.log
          grep -oP '(?<=session_id=)[0-9a-f-]+' session1.log > session1.id
          [ -s session1.id ] || { echo "::error::no session before restart"; exit 1; }

      - name: Negative — connection without token is refused and closed
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" deploy/xiaozhi/probe_hello.py \
            --url ws://127.0.0.1:8000/xiaozhi/v1/ \
            --device-id aa:bb:cc:dd:ee:01 --client-id negative-probe \
            --expect-auth-failure

      - name: Negative — binary audio is silently dropped (no ASR configured, face stays alive)
        shell: bash
        run: |
          set -euo pipefail
          source xiaozhi-smoke.env
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" deploy/xiaozhi/probe_hello.py \
            --url ws://127.0.0.1:8000/xiaozhi/v1/ \
            --device-id aa:bb:cc:dd:ee:02 --client-id negative-probe \
            --expect-silent-binary

      - name: Restart recovery — same pinned config, fresh session
        shell: bash
        run: |
          set -euo pipefail
          source xiaozhi-smoke.env
          PIDFILE="$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server.pid"
          kill -TERM "$(cat "$PIDFILE")"
          for _ in $(seq 1 20); do kill -0 "$(cat "$PIDFILE")" 2>/dev/null || break; sleep 1; done
          cd "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server"
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" app.py > server2.log 2>&1 &
          echo $! > server.pid
          session2="$("$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" "$GITHUB_WORKSPACE/deploy/xiaozhi/probe_hello.py" \
            --url ws://127.0.0.1:8000/xiaozhi/v1/ \
            --device-id aa:bb:cc:dd:ee:03 --client-id restart-probe --without-abort \
            --auth-key "${XIAOZHI_AUTH_KEY}" | tee /tmp/session2.log | grep -oP '(?<=session_id=)[0-9a-f-]+')"
          [ -n "${session2}" ] || { echo "::error::no session after restart"; exit 1; }
          session1="$(cat "$GITHUB_WORKSPACE/session1.id")"
          if [ "${session2}" = "${session1}" ]; then
            echo "::error::session_id did not rotate across restart (mapping stale?)"
            exit 1
          fi
          echo "restart recovery OK (fresh session_id minted)"

      - name: Corrupted-config negative — the boot must fail fast, not limp
        shell: bash
        run: |
          set -euo pipefail
          PIDFILE="$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server.pid"
          kill -TERM "$(cat "$PIDFILE")" 2>/dev/null || true
          sleep 2
          CFG="$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/data/.config.yaml"
          printf '\n:::: corrupted ::::\n' >> "${CFG}"
          cd "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server"
          set +e
          timeout 30 "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" app.py > server3.log 2>&1
          code=$?
          set -e
          [ "${code}" -ne 0 ] || { echo "::error::corrupted config did not fail the boot"; tail -30 server3.log; exit 1; }
          tail -30 server3.log | grep -qiE 'yaml|scanner|parser|error' || {
            echo "::error::boot failed without a config-parse error trace"; tail -30 server3.log; exit 1; }
          echo "corrupted-config negative OK (non-zero exit with parse error)"

      - name: Failure evidence (small tails only)
        if: failure()
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server1.log" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server2.log" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server3.log" 2>/dev/null || true
