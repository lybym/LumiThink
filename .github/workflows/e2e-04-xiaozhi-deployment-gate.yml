          for module in ("LLM", "TTS"):
              collect(effective[module][effective["selected_module"][module]])
          collect(effective["ASR"]["AliyunBLStreamASR"])
          bad = [h for h in hosts if not loopback_re.match(h)]
          assert not bad, f"real-ASR tier active surface carries non-loopback config endpoints: {bad}"
          print("gateway-asr-real effective config OK (reviewed selection, retention gates, loopback LLM/TTS; not booted)")
          PY

      - name: Real-TTS tier (E2E-06) — effective merged config scan (render only; NO boot, NO vendor network)
        shell: bash
        run: |
          set -euo pipefail
          # E2E-06 (issue #56): prove what the reviewed real-TTS tier would be
          # EFFECTIVE at runtime (upstream recursive merge), fail-closed on
          # pin drift — WITHOUT booting it: no server start, no dashscope
          # connection, no credential beyond a dummy CI value.
          work="$(mktemp -d)"
          cp xiaozhi-smoke.env "${work}/tts.env"
          printf 'XIAOZHI_TTS_API_KEY=dummy-ci-not-a-real-key\n' >> "${work}/tts.env"
          chmod 600 "${work}/tts.env"
          python3 deploy/xiaozhi/render_config.py \
            --template deploy/xiaozhi/config/gateway-tts-real.yaml \
            --env-file "${work}/tts.env" --output "${work}/tts-overlay.yaml"
          TTS_OVERLAY="${work}/tts-overlay.yaml" "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" - <<'PY'
          import os
          import re
          import yaml

          server_root = os.path.join(
              os.environ["RUNNER_TEMP"], "xiaozhi-esp32-server", "main", "xiaozhi-server"
          )

          def merge(defaults, overlay):
              # Same pinned-commit mirror as the gateway-minimal scan above
              # (upstream config_loader.merge_configs: recursive dict merge,
              # overlay wins). Re-verify on any future pin bump.
              if not isinstance(defaults, dict) or not isinstance(overlay, dict):
                  return overlay
              merged = dict(defaults)
              for key, value in overlay.items():
                  if isinstance(merged.get(key), dict) and isinstance(value, dict):
                      merged[key] = merge(merged[key], value)
                  else:
                      merged[key] = value
              return merged

          with open(os.path.join(server_root, "config.yaml"), encoding="utf-8") as fh:
              upstream = yaml.safe_load(fh)
          with open(os.environ["TTS_OVERLAY"], encoding="utf-8") as fh:
              overlay = yaml.safe_load(fh)
          effective = merge(upstream, overlay)

          expected = {
              "VAD": "SileroVAD",
              "ASR": "FunASRServer",
              "LLM": "OllamaLLM",
              "TTS": "AliBLStreamTTS",
              "VLLM": "",
              "Memory": "nomem",
              "Intent": "nointent",
          }
          assert effective["selected_module"] == expected, effective["selected_module"]

          tts = effective["TTS"]["AliBLStreamTTS"]
          assert tts["type"] == "alibl_stream", tts
          assert tts["model"] == "cosyvoice-v2" and tts["voice"] == "longxiaochun_v2", tts
          assert tts["format"] == "pcm", tts
          # Comparison only — the dummy value is never printed.
          assert tts["api_key"] == "dummy-ci-not-a-real-key", "render-time injection failed"
          # The review anchor must stay the pinned code default, not config.
          assert "ws_url" not in tts, tts
          # Pinned-upstream binding (review R1 P2-2): the review anchor is the
          # pinned checkout's OWN hardcoded default, so extract it from the
          # pinned code and compare THREE ways — the LumiThink activation
          # constant, the runbook anchor and the template anchor comment must
          # all carry the same URL verbatim. A pin bump that changes
          # DEFAULT_WS_URL fails HERE (re-run the egress review) instead of
          # leaving the recorded anchor stale. (#55's ASR anchor has the same
          # pattern; that residual belongs to issue #55's scope.)
          with open(os.path.join(server_root, "core", "utils", "alibl_endpoint.py"), encoding="utf-8") as fh:
              alibl_src = fh.read()
          upstream_match = re.search(r'DEFAULT_WS_URL\s*=\s*"([^"]+)"', alibl_src)
          assert upstream_match, "pinned alibl_endpoint.py no longer carries a literal DEFAULT_WS_URL"
          upstream_default = upstream_match.group(1)
          with open("lib/server/real-tts-composition.ts", encoding="utf-8") as fh:
              ts_src = fh.read()
          ts_match = re.search(r'REAL_TTS_VENDOR_ENDPOINT\s*=\s*"([^"]+)"', ts_src)
          ts_value = ts_match.group(1) if ts_match else "<absent>"
          assert ts_value == upstream_default, (
              "LumiThink REAL_TTS_VENDOR_ENDPOINT (%r) != pinned upstream DEFAULT_WS_URL (%r)"
              " — the vendor endpoint review anchor drifted; re-run the egress review"
              % (ts_value, upstream_default)
          )
          with open("deploy/xiaozhi/runbook.md", encoding="utf-8") as fh:
              runbook_src = fh.read()
          assert upstream_default in runbook_src, "runbook anchor drifted from the pinned upstream default"
          with open("deploy/xiaozhi/config/gateway-tts-real.yaml", encoding="utf-8") as fh:
              template_src = fh.read()
          assert upstream_default in template_src, "template anchor comment drifted from the pinned upstream default"
          print("pinned DEFAULT_WS_URL three-way binding OK (%s)" % upstream_default)
          assert effective["log"]["log_level"] == "WARNING", effective["log"]
          assert effective["delete_audio"] is True
          assert effective["read_config_from_api"] is False

          # Beyond the reviewed TTS vendor (whose endpoint lives in pinned
          # provider CODE, not config), every URL in the active provider
          # surface must still be loopback: ASR/LLM placeholders unchanged.
          url_re = re.compile(r"https?://([^/\s\"']+)")
          loopback_re = re.compile(r"^(127\.0\.0\.1|localhost)(:\d+)?$")
          hosts = []

          def collect(node):
              if isinstance(node, dict):
                  for value in node.values():
                      collect(value)
              elif isinstance(node, list):
                  for value in node:
                      collect(value)
              elif isinstance(node, str):
                  hosts.extend(url_re.findall(node))

          for module in ("ASR", "LLM"):
              collect(effective[module][effective["selected_module"][module]])
          collect(effective["TTS"]["AliBLStreamTTS"])
          bad = [h for h in hosts if not loopback_re.match(h)]
          assert not bad, f"real-TTS tier active surface carries non-loopback config endpoints: {bad}"
          print("gateway-tts-real effective config OK (reviewed selection, retention gates, loopback ASR/LLM; not booted)")
          PY

      - name: Boot the gateway-minimal server (foreground, smoke env)
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$GITHUB_WORKSPACE/xiaozhi-smoke.env"; set +a
          cd "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server"
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" app.py > server1.log 2>&1 &
          echo $! > server.pid
          echo "started pid $(cat server.pid)"

      - name: Health check (OTA grant + loopback binding + hello/abort probe)
        shell: bash
        run: |
          set -euo pipefail
          # set -a: healthcheck.sh is a CHILD process — the sourced smoke env
          # must be EXPORTED or XIAOZHI_AUTH_KEY never reaches it.
          set -a; source xiaozhi-smoke.env; set +a
          XIAOZHI_PYTHON="$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" \
            bash deploy/xiaozhi/healthcheck.sh

      - name: Capture pre-restart session_id
        shell: bash
        run: |
          set -euo pipefail
          source xiaozhi-smoke.env
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" deploy/xiaozhi/probe_hello.py \
            --url ws://127.0.0.1:8000/xiaozhi/v1/ \
            --device-id aa:bb:cc:dd:ee:04 --client-id restart-probe --without-abort \
            --auth-key "${XIAOZHI_AUTH_KEY}" | tee session1.log
          grep -oP '(?<=session_id=)[0-9a-f-]+' session1.log > session1.id
          [ -s session1.id ] || { echo "::error::no session before restart"; exit 1; }

      - name: Negative — connection without token is refused and closed
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" deploy/xiaozhi/probe_hello.py \
            --url ws://127.0.0.1:8000/xiaozhi/v1/ \
            --device-id aa:bb:cc:dd:ee:01 --client-id negative-probe \
            --expect-auth-failure

      - name: Negative — junk binary gets no content and no crash
        shell: bash
        run: |
          set -euo pipefail
          # set -a: the probe reads XIAOZHI_AUTH_KEY from its process env.
          set -a; source xiaozhi-smoke.env; set +a
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" deploy/xiaozhi/probe_hello.py \
            --url ws://127.0.0.1:8000/xiaozhi/v1/ \
            --device-id aa:bb:cc:dd:ee:02 --client-id negative-probe \
            --expect-silent-binary

      - name: Restart recovery — same pinned config, same device, fresh session
        shell: bash
        run: |
          set -euo pipefail
          set -a; source xiaozhi-smoke.env; set +a
          PIDFILE="$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server.pid"
          kill -TERM "$(cat "$PIDFILE")"
          for _ in $(seq 1 20); do kill -0 "$(cat "$PIDFILE")" 2>/dev/null || break; sleep 1; done
          cd "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server"
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" app.py > server2.log 2>&1 &
          echo $! > server.pid
          # Readiness poll: server2 takes a few seconds to import + bind; probe
          # until the hello succeeds (max ~45s) instead of racing the boot.
          # Review R1 P2-2: the SAME device-id reconnects across the restart —
          # under upstream's per-connection uuid4 session_id the id MUST change
          # even for the same device, so this discriminates against a
          # per-device session mapping being reused (two different device-ids
          # would make the inequality a tautology).
          rm -f /tmp/session2.log
          ready=""
          for _ in $(seq 1 45); do
            if "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" "$GITHUB_WORKSPACE/deploy/xiaozhi/probe_hello.py" \
              --url ws://127.0.0.1:8000/xiaozhi/v1/ \
              --device-id aa:bb:cc:dd:ee:04 --client-id restart-probe --without-abort \
              --auth-key "${XIAOZHI_AUTH_KEY}" > /tmp/session2.log 2>&1; then
              ready="1"
              break
            fi
            sleep 1
          done
          [ -n "${ready}" ] || { echo "::error::server2 never became ready after restart"; tail -30 server2.log; exit 1; }
          cat /tmp/session2.log
          session2="$(grep -oP '(?<=session_id=)[0-9a-f-]+' /tmp/session2.log | head -1)"
          [ -n "${session2}" ] || { echo "::error::no session after restart"; exit 1; }
          session1="$(cat "$GITHUB_WORKSPACE/session1.id")"
          if [ "${session2}" = "${session1}" ]; then
            echo "::error::same device reconnected after restart but session_id did not change (per-device mapping reused?)"
            exit 1
          fi
          echo "restart recovery OK (same device-id, fresh per-connection session_id)"

      - name: Corrupted-config negative — the boot must fail fast, not limp
        shell: bash
        run: |
          set -euo pipefail
          PIDFILE="$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server.pid"
          kill -TERM "$(cat "$PIDFILE")" 2>/dev/null || true
          # Review R2 P2-2: poll for the process to exit instead of a blind
          # `sleep 2` — a slow shutdown could leave server2 holding port 8000
          # when server3 boots, so ANY later failure trace (e.g. port-in-use)
          # would be misattributable. After this loop the ONLY possible boot
          # failure cause is the corrupted config itself.
          for _ in $(seq 1 20); do
            kill -0 "$(cat "$PIDFILE")" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$(cat "$PIDFILE")" 2>/dev/null; then
            echo "::error::server did not exit within 20s of TERM"
            tail -30 "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server2.log" || true
            exit 1
          fi
          CFG="$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/data/.config.yaml"
          printf '\n:::: corrupted ::::\n' >> "${CFG}"
          cd "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server"
          set +e
          timeout 30 "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" app.py > server3.log 2>&1
          code=$?
          set -e
          [ "${code}" -ne 0 ] || { echo "::error::corrupted config did not fail the boot"; tail -30 server3.log; exit 1; }
          # Signature tightened (review R2 P2-2): no bare `error` — an
          # unrelated traceback (e.g. OSError port-in-use) must NOT pass this
          # negative. PyYAML failures surface as yaml.scanner/yaml.parser
          # errors (or name the .config.yaml path), so these tokens suffice.
          tail -30 server3.log | grep -qiE 'yaml|scanner|parser' || {
            echo "::error::boot failed without a config-parse error trace"; tail -30 server3.log; exit 1; }
          echo "corrupted-config negative OK (non-zero exit with parse error)"

      - name: Re-render idempotency — --skip-clone repairs the corrupted config
        shell: bash
        run: |
          set -euo pipefail
          # Review R1 test-gap 3 + runbook §6 remedy as machine evidence: the
          # documented recovery loop (bootstrap --skip-clone re-render) must
          # be idempotent and must turn the corrupted config back into valid
          # YAML (the previous step appended garbage). Unprivileged CI path:
          # no chown happens here (runner user owns the tree and boots it).
          bash deploy/xiaozhi/bootstrap.sh \
            --target "$RUNNER_TEMP/xiaozhi-esp32-server" \
            --env-file "$(pwd)/xiaozhi-smoke.env" \
            --skip-clone
          CFG="$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/data/.config.yaml"
          stat -c '%a' "${CFG}" | grep -qx '600' || { echo "::error::re-rendered config is not 0600"; exit 1; }
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" - <<'PY'
          import os
          import yaml
          cfg_path = os.path.join(
              os.environ["RUNNER_TEMP"], "xiaozhi-esp32-server", "main", "xiaozhi-server",
              "data", ".config.yaml",
          )
          with open(cfg_path, encoding="utf-8") as fh:
              cfg = yaml.safe_load(fh)
          assert isinstance(cfg, dict) and cfg["server"]["ip"] == "127.0.0.1"
          print("re-render idempotency OK (--skip-clone restored a valid 0600 config)")
          PY

      - name: Failure evidence (small tails only)
        if: failure()
        shell: bash
        run: |
          tail -40 "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server1.log" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server2.log" 2>/dev/null || true
          tail -40 "$RUNNER_TEMP/xiaozhi-esp32-server/main/xiaozhi-server/server3.log" 2>/dev/null || true
