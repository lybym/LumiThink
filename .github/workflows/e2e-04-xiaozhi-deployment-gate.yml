name: E2E-04 xiaozhi deployment gate

# E2E-04 (issue #54): the pinned xiaozhi-esp32-server private deployment must be
# provable on a clean Linux runner WITHOUT claiming real-device readiness
# (#E2E-08 owns device acceptance). Two jobs:
#   1. artifacts — syntax + template/pin integrity of deploy/xiaozhi/**,
#      plus a runtime regression for the render ownership contract (0600
#      atomic write, --owner survives a root re-render; review R1 P1-1);
#   2. deployment-smoke — bootstrap the pinned commit from scratch
#      (clone-by-SHA -> venv -> gateway-minimal deps -> rendered config),
#      scan the EFFECTIVE merged config (upstream defaults + overlay;
#      review R1 P2-1), boot it, and prove: OTA grant, OTA-issued token
#      replayed over WSS, loopback-only binding, simulated-device hello ack +
#      abort->tts stop, auth refusal negative, silent binary drop negative,
#      restart recovery with the same device-id, corrupted-config fail-fast
#      negative, and --skip-clone re-render idempotency.
#   3. real-ASR tier (E2E-05, issue #55) — the reviewed gateway-asr-real
#      overlay is parsed, render-checked fail-closed and merge-scanned for
#      the effective surface WITHOUT booting it: no server start against the
#      tier, no vendor connection, no credential beyond a dummy CI value
#      (real-provider runs are operator opt-in, never CI).
#   4. real-TTS tier (E2E-06, issue #56) — same render/scan discipline for
#      the reviewed gateway-tts-real overlay (CosyVoice dual-stream TTS at
#      the pinned extension point): parsed, fail-closed render-checked and
#      merge-scanned WITHOUT booting it; no vendor network, no real credential.
# No real credentials, no real device, no external egress: the gateway-minimal
# profile selects only loopback placeholder ASR/LLM/TTS providers and
# explicitly disables VLLM (selected_module.VLLM=""); the real-ASR and
# real-TTS tiers are rendered/merged/scanned only.
on:
  pull_request:
    paths:
      - 'deploy/xiaozhi/**'
      - 'tests/deploy/**'
      - 'lib/domain/voice/adapter/protocol.ts'
      - '.github/workflows/e2e-04-xiaozhi-deployment-gate.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/xiaozhi/**'
      - 'tests/deploy/**'
      - 'lib/domain/voice/adapter/protocol.ts'
      - '.github/workflows/e2e-04-xiaozhi-deployment-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-04-xiaozhi-deployment-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'

jobs:
  artifacts:
    name: Deployment artifacts (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell scripts pass bash -n
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/xiaozhi/*.sh; do
            bash -n "${script}"
            echo "bash -n OK: ${script}"
          done

      - name: Python scripts compile
        shell: bash
        run: |
          set -euo pipefail
          for script in deploy/xiaozhi/*.py; do
            python3 -m py_compile "${script}"
            echo "py_compile OK: ${script}"
          done

      - name: systemd unit passes systemd-analyze verify
        shell: bash
        run: |
          set -euo pipefail
          # Same arbitration as r1-deployment-gate.yml (issue #20): the grep —
          # not the exit code — decides; missing ExecStart binary / service
          # user are deploy-host facts, silent verify output is a hard failure.
          systemd-analyze verify deploy/xiaozhi/xiaozhi-server.service 2>&1 | tee /tmp/unit-verify.log || true
          if [ ! -s /tmp/unit-verify.log ]; then
            echo "::error::systemd-analyze verify produced no output; cannot arbitrate"
            exit 1
          fi
          if grep -qE 'Failed to parse|Failed to load|Refusing|Unknown key name' /tmp/unit-verify.log; then
            echo "::error::systemd unit has parse errors"
            grep -E 'Failed to parse|Failed to load|Refusing|Unknown key name' /tmp/unit-verify.log
            exit 1
          fi
          echo "unit syntax OK"

      - name: Config template parses as YAML, loopback-only, explicit-disabled
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import re
          import yaml
          cfg = yaml.safe_load(open("deploy/xiaozhi/config/gateway-minimal.yaml", encoding="utf-8"))
          server = cfg["server"]
          assert server["ip"] == "127.0.0.1", server["ip"]
          assert server["auth"]["enabled"] is True
          assert server["auth"]["allowed_devices"] == []
          # Recursive merge keeps upstream default keys alive: every module key
          # must be EXPLICITLY overridden (cognitive layers -> loopback dead
          # endpoints, Memory/Intent explicitly off).
          sm = cfg["selected_module"]
          assert set(sm.keys()) == {"VAD", "ASR", "LLM", "TTS", "VLLM", "Memory", "Intent"}, sm
          assert sm["Memory"] == "nomem" and sm["Intent"] == "nointent"
          # VLLM must be explicitly DISABLED ("" is falsy: upstream
          # vision_handler raises before instantiating any provider — i.e.
          # before any egress; the multipart request-body read happens BEFORE
          # that raise, but reading produces no egress — review R2 P1-1
          # wording fix). Selecting the upstream default ChatGLMVLLM would
          # send vision requests to https://open.bigmodel.cn (review R1 P2-1).
          assert sm["VLLM"] == "", sm
          assert cfg["ASR"]["FunASRServer"]["host"] == "127.0.0.1"
          assert cfg["LLM"]["OllamaLLM"]["base_url"].startswith("http://127.0.0.1")
          assert cfg["TTS"]["CustomTTS"]["url"].startswith("http://127.0.0.1")
          # No external host anywhere on active lines (loopback or ${VAR} only).
          for raw_line in open("deploy/xiaozhi/config/gateway-minimal.yaml", encoding="utf-8"):
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              for match in re.finditer(r"https?://([^/\s\"']+)", line):
                  host = match.group(1)
                  assert re.match(r"^(\$\{[A-Z_][A-Z0-9_]*\}|127\.0\.0\.1|localhost)(:\d+)?$", host), line
          print("gateway-minimal template OK (loopback, auth on, explicit-disabled map)")
          PY

      - name: render_config.py — 0600 atomic write, owner survives a root re-render
        shell: bash
        run: |
          set -euo pipefail
          # Regression for review R1 P1-1: os.replace does NOT preserve the
          # replaced file's owner, so the SECOND root render must re-apply
          # --owner or the service user loses read access to its 0600 config
          # (crash-loop on every documented rotation/rollback flow). The tool
          # is stdlib-only, so this runs without the upstream checkout.
          sudo groupadd -f render-owner-test
          sudo useradd -g render-owner-test render-owner-test
          work="$(mktemp -d)"
          chmod 755 "${work}"
          mkdir -p "${work}/out" && chmod 755 "${work}/out"
          printf 'k: ${XIAOZHI_TEST_ONLY}\n' > "${work}/template.yaml"
          printf 'XIAOZHI_TEST_ONLY=first\n' > "${work}/first.env"
          printf 'XIAOZHI_TEST_ONLY=second\n' > "${work}/second.env"
          render() {
            sudo python3 deploy/xiaozhi/render_config.py \
              --template "${work}/template.yaml" --env-file "$1" \
              --output "${work}/out/.config.yaml" --owner render-owner-test
          }
          render "${work}/first.env"
          render "${work}/second.env"   # the re-render from the defect report
          # Owner, group, mode and content must all be service-user usable.
          stat_out="$(stat -c '%U:%G %a' "${work}/out/.config.yaml")"
          [ "${stat_out}" = "render-owner-test:render-owner-test 600" ] || {
            echo "::error::re-render lost service-user ownership/mode: ${stat_out}"; exit 1; }
          sudo -u render-owner-test cat "${work}/out/.config.yaml" | grep -q 'second' || {
            echo "::error::service user cannot read the re-rendered config"; exit 1; }
          # Atomic replace must leave no temp file droppings behind.
          leftovers="$(ls -A "${work}/out" | grep -v '^\.config\.yaml$' || true)"
          [ -z "${leftovers}" ] || { echo "::error::temp files left behind: ${leftovers}"; exit 1; }
          echo "render ownership regression OK (0600, owner preserved across re-render)"

      - name: Real-ASR tier template (E2E-05, issue #55) parses; reviewed provider, transcript-log suppression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import re
          import yaml
          cfg = yaml.safe_load(open("deploy/xiaozhi/config/gateway-asr-real.yaml", encoding="utf-8"))
          assert cfg["server"]["ip"] == "127.0.0.1", cfg["server"]["ip"]
          assert cfg["server"]["auth"]["enabled"] is True
          assert cfg["server"]["auth"]["allowed_devices"] == []
          sm = cfg["selected_module"]
          assert set(sm.keys()) == {"VAD", "ASR", "LLM", "TTS", "VLLM", "Memory", "Intent"}, sm
          # The ONLY tier change vs gateway-minimal: the reviewed first real
          # streaming ASR provider at the pinned commit's extension point.
          assert sm["ASR"] == "AliyunBLStreamASR", sm
          assert sm["VLLM"] == "" and sm["Memory"] == "nomem" and sm["Intent"] == "nointent"
          asr = cfg["ASR"]["AliyunBLStreamASR"]
          assert asr["type"] == "aliyunbl_stream", asr
          assert asr["api_key"] == "${XIAOZHI_ASR_API_KEY}", "credential must be render-time injected, never literal"
          assert asr["model"] == "paraformer-realtime-v2", asr
          assert asr["sample_rate"] == 16000 and asr["format"] == "pcm", asr
          assert asr["max_sentence_silence"] == 200, asr
          # Pinned-commit fact: asr/base.py + asr/aliyunbl_stream.py log the
          # transcript at INFO — the real-ASR tier must suppress it.
          assert cfg["log"]["log_level"] == "WARNING", cfg["log"]
          assert cfg["delete_audio"] is True
          assert cfg["read_config_from_api"] is False, "report queues must stay structurally off"
          assert cfg["LLM"]["OllamaLLM"]["base_url"].startswith("http://127.0.0.1")
          assert cfg["TTS"]["CustomTTS"]["url"].startswith("http://127.0.0.1")
          # No concrete external host on active lines (the reviewed vendor
          # endpoint is upstream-hardcoded — documented, not a template value).
          for raw_line in open("deploy/xiaozhi/config/gateway-asr-real.yaml", encoding="utf-8"):
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              for match in re.finditer(r"https?://([^/\s\"']+)", line):
                  host = match.group(1)
                  assert re.match(r"^(\$\{[A-Z_][A-Z0-9_]*\}|127\.0\.0\.1|localhost)(:\d+)?$", host), line
          print("gateway-asr-real template OK (reviewed streaming ASR, WARNING logs, zero retention)")
          PY

      - name: Real-ASR tier render is fail-closed on a missing provider key, then 0600 on the happy path
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          printf 'XIAOZHI_AUTH_KEY=%s\n' "$(openssl rand -hex 32)" > "${work}/asr.env"
          printf 'XIAOZHI_DEVICE_WS_URL=ws://127.0.0.1:8000/xiaozhi/v1/\n' >> "${work}/asr.env"
          printf 'XIAOZHI_PUBLIC_DOMAIN=127.0.0.1\n' >> "${work}/asr.env"
          # Missing XIAOZHI_ASR_API_KEY → render refuses, naming the variable.
          if python3 deploy/xiaozhi/render_config.py \
              --template deploy/xiaozhi/config/gateway-asr-real.yaml \
              --env-file "${work}/asr.env" --output "${work}/out.yaml" 2>"${work}/err.log"; then
            echo "::error::render succeeded without the ASR provider key"
            exit 1
          fi
          grep -q "XIAOZHI_ASR_API_KEY" "${work}/err.log" || {
            echo "::error::fail-closed error does not name the missing variable"; cat "${work}/err.log"; exit 1; }
          # Happy path: a dummy CI value (never a real credential) renders a 0600 overlay.
          printf 'XIAOZHI_ASR_API_KEY=dummy-ci-not-a-real-key\n' >> "${work}/asr.env"
          python3 deploy/xiaozhi/render_config.py \
            --template deploy/xiaozhi/config/gateway-asr-real.yaml \
            --env-file "${work}/asr.env" --output "${work}/out.yaml"
          stat -c '%a' "${work}/out.yaml" | grep -qx '600' || { echo "::error::rendered overlay is not 0600"; exit 1; }
          echo "real-ASR tier render contract OK (fail-closed, 0600)"

      - name: Real-TTS tier template (E2E-06, issue #56) parses; reviewed provider, retention gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import re
          import yaml
          cfg = yaml.safe_load(open("deploy/xiaozhi/config/gateway-tts-real.yaml", encoding="utf-8"))
          assert cfg["server"]["ip"] == "127.0.0.1", cfg["server"]["ip"]
          assert cfg["server"]["auth"]["enabled"] is True
          assert cfg["server"]["auth"]["allowed_devices"] == []
          sm = cfg["selected_module"]
          assert set(sm.keys()) == {"VAD", "ASR", "LLM", "TTS", "VLLM", "Memory", "Intent"}, sm
          # The ONLY tier change vs gateway-minimal: the reviewed first real
          # TTS provider at the pinned commit's extension point. ASR/LLM stay
          # loopback placeholders (the TTS review implies neither).
          assert sm["TTS"] == "AliBLStreamTTS", sm
          assert sm["ASR"] == "FunASRServer" and sm["LLM"] == "OllamaLLM", sm
          assert sm["VLLM"] == "" and sm["Memory"] == "nomem" and sm["Intent"] == "nointent"
          tts = cfg["TTS"]["AliBLStreamTTS"]
          assert tts["type"] == "alibl_stream", tts
          assert tts["api_key"] == "${XIAOZHI_TTS_API_KEY}", "credential must be render-time injected, never literal"
          assert tts["model"] == "cosyvoice-v2", tts
          assert tts["voice"] == "longxiaochun_v2", tts
          assert tts["format"] == "pcm", tts
          # Pinned-commit fact: tts/base.py + tts/alibl_stream.py log sentence
          # text at INFO — the real-TTS tier must suppress it.
          assert cfg["log"]["log_level"] == "WARNING", cfg["log"]
          assert cfg["delete_audio"] is True
          assert cfg["read_config_from_api"] is False, "report queues must stay structurally off"
          assert cfg["ASR"]["FunASRServer"]["host"] == "127.0.0.1"
          assert cfg["LLM"]["OllamaLLM"]["base_url"].startswith("http://127.0.0.1")
          # The pinned DEFAULT_WS_URL is the review anchor: the template must
          # NOT override ws_url (any override = re-run the egress review).
          assert "ws_url" not in tts, tts
          # No concrete external host on active lines (the reviewed vendor
          # endpoint is a pinned-code default — documented, not a template value).
          for raw_line in open("deploy/xiaozhi/config/gateway-tts-real.yaml", encoding="utf-8"):
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              for match in re.finditer(r"https?://([^/\s\"']+)", line):
                  host = match.group(1)
                  assert re.match(r"^(\$\{[A-Z_][A-Z0-9_]*\}|127\.0\.0\.1|localhost)(:\d+)?$", host), line
          print("gateway-tts-real template OK (reviewed dual-stream TTS, WARNING logs, zero retention)")
          PY

      - name: Real-TTS tier render is fail-closed on a missing provider key, then 0600 on the happy path
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          printf 'XIAOZHI_AUTH_KEY=%s\n' "$(openssl rand -hex 32)" > "${work}/tts.env"
          printf 'XIAOZHI_DEVICE_WS_URL=ws://127.0.0.1:8000/xiaozhi/v1/\n' >> "${work}/tts.env"
          printf 'XIAOZHI_PUBLIC_DOMAIN=127.0.0.1\n' >> "${work}/tts.env"
          # Missing XIAOZHI_TTS_API_KEY → render refuses, naming the variable.
          if python3 deploy/xiaozhi/render_config.py \
              --template deploy/xiaozhi/config/gateway-tts-real.yaml \
              --env-file "${work}/tts.env" --output "${work}/out.yaml" 2>"${work}/err.log"; then
            echo "::error::render succeeded without the TTS provider key"
            exit 1
          fi
          grep -q "XIAOZHI_TTS_API_KEY" "${work}/err.log" || {
            echo "::error::fail-closed error does not name the missing variable"; cat "${work}/err.log"; exit 1; }
          # Happy path: a dummy CI value (never a real credential) renders a 0600 overlay.
          printf 'XIAOZHI_TTS_API_KEY=dummy-ci-not-a-real-key\n' >> "${work}/tts.env"
          python3 deploy/xiaozhi/render_config.py \
            --template deploy/xiaozhi/config/gateway-tts-real.yaml \
            --env-file "${work}/tts.env" --output "${work}/out.yaml"
          stat -c '%a' "${work}/out.yaml" | grep -qx '600' || { echo "::error::rendered overlay is not 0600"; exit 1; }
          echo "real-TTS tier render contract OK (fail-closed, 0600)"

      - name: Env template carries no real secrets
        shell: bash
        run: |
          set -euo pipefail
          # Same discipline as r1-deployment-gate.yml: every active value line
          # must be empty or a documented placeholder shape.
          if grep -E '^XIAOZHI_[A-Z_]+=.+' deploy/xiaozhi/env/gateway-minimal.example \
             | grep -vE '(<generate|xiaozhi\.example\.com)'; then
            echo "::error::env template must not carry real values"
            exit 1
          fi
          echo "template clean"

      - name: Minimal requirements are fully pinned (no floating refs)
        shell: bash
        run: |
          set -euo pipefail
          if grep -vE '^\s*(#|$)' deploy/xiaozhi/requirements-gateway-minimal.txt \
             | grep -vE '^[A-Za-z0-9_.-]+==[A-Za-z0-9.]+$'; then
            echo "::error::unpinned requirement line detected"
            exit 1
          fi
          echo "requirements-gateway-minimal.txt fully pinned"

      - name: Pinned version markers are single-sourced
        shell: bash
        run: |
          set -euo pipefail
          commit="$(grep -oP '(?<=^XIAOZHI_SERVER_COMMIT=)[0-9a-f]{40}$' deploy/xiaozhi/version.env)"
          [ "$(grep -c "${commit}" deploy/xiaozhi/version.env)" -ge 1 ]
          # protocol.ts baseline must agree with version.env (also asserted by
          # tests/deploy/xiaozhi-deployment.spec.ts in the Node suite).
          grep -q "main@${commit}" lib/domain/voice/adapter/protocol.ts
          echo "version pin single-sourced: ${commit:0:12}"

  deployment-smoke:
    name: xiaozhi clean-env deployment smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install + assert system deps (ffmpeg, libopus) — upstream runtime requirements
        shell: bash
        run: |
          set -euo pipefail
          # ffmpeg + libopus0 are genuine upstream runtime requirements
          # (app.py's check_ffmpeg_installed / opuslib_next's ctypes libopus);
          # hosted runners no longer ship ffmpeg, so install explicitly and
          # assert both before any deployment step.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg libopus0
          ffmpeg -version | head -1
          python3 -c "import ctypes; ctypes.CDLL('libopus.so.0'); print('libopus OK')"

      - name: Generate smoke secrets (never committed, never echoed)
        shell: bash
        run: |
          set -euo pipefail
          echo "XIAOZHI_AUTH_KEY=$(openssl rand -hex 32)" > xiaozhi-smoke.env
          echo "XIAOZHI_DEVICE_WS_URL=ws://127.0.0.1:8000/xiaozhi/v1/" >> xiaozhi-smoke.env
          echo "XIAOZHI_PUBLIC_DOMAIN=127.0.0.1" >> xiaozhi-smoke.env
          chmod 600 xiaozhi-smoke.env

      - name: Bootstrap pinned server from scratch (clone-by-SHA, venv, minimal deps)
        shell: bash
        run: |
          set -euo pipefail
          bash deploy/xiaozhi/bootstrap.sh \
            --target "$RUNNER_TEMP/xiaozhi-esp32-server" \
            --env-file "$(pwd)/xiaozhi-smoke.env"

      - name: Effective merged config — explicit module map, loopback-only active surface
        shell: bash
        run: |
          set -euo pipefail
          # Review R1 P2-1: scanning only the repo template misses what is
          # actually EFFECTIVE at runtime — upstream config.yaml defaults
          # merged (recursively, custom wins) with the rendered overlay by
          # upstream config_loader.load_config. Mirror that merge and assert
          # the real surface. Never prints secret values (hosts/module names
          # only).
          "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" - <<'PY'
          import os
          import re
          import yaml

          server_root = os.path.join(
              os.environ["RUNNER_TEMP"], "xiaozhi-esp32-server", "main", "xiaozhi-server"
          )

          def merge(defaults, overlay):
              # Mirrors upstream config_loader.merge_configs exactly: recursive
              # dict merge, the custom (overlay) side wins on conflicts. The
              # mirror is anchored at the pinned upstream commit (27399a2…,
              # see deploy/xiaozhi/version.env) — re-verify it verbatim on any
              # future pin bump (review R2 test-gap).
              if not isinstance(defaults, dict) or not isinstance(overlay, dict):
                  return overlay
              merged = dict(defaults)
              for key, value in overlay.items():
                  if isinstance(merged.get(key), dict) and isinstance(value, dict):
                      merged[key] = merge(merged[key], value)
                  else:
                      merged[key] = value
              return merged

          with open(os.path.join(server_root, "config.yaml"), encoding="utf-8") as fh:
              upstream = yaml.safe_load(fh)
          with open(os.path.join(server_root, "data", ".config.yaml"), encoding="utf-8") as fh:
              overlay = yaml.safe_load(fh)
          effective = merge(upstream, overlay)

          expected = {
              "VAD": "SileroVAD",
              "ASR": "FunASRServer",
              "LLM": "OllamaLLM",
              "TTS": "CustomTTS",
              "VLLM": "",  # falsy: upstream vision_handler raises before any egress
              "Memory": "nomem",
              "Intent": "nointent",
          }
          assert effective["selected_module"] == expected, effective["selected_module"]
          assert not effective["selected_module"]["VLLM"]

          # Review R2 P1-1 (enhancement adopted): pin the UPSTREAM default
          # shape this profile's safety rationale depends on. Upstream
          # config.yaml ships EXTERNAL VLLM provider segments — the recursive
          # merge keeps them alive in the EFFECTIVE config; only
          # selected_module.VLLM="" keeps them uninstantiated. If a future pin
          # bump changes/removes these defaults, fail here (and force a
          # re-review of the gateway-minimal rationale) instead of letting
          # the "must explicitly disable VLLM" comments silently lose their
          # meaning while CI stays green. Public hosts only — no secrets.
          vllm_defaults = effective.get("VLLM") or {}
          for name, external_host in (
              ("ChatGLMVLLM", "open.bigmodel.cn"),
              ("QwenVLVLLM", "dashscope.aliyuncs.com"),
          ):
              url = (vllm_defaults.get(name) or {}).get("url", "")
              assert external_host in url, (
                  f"upstream default VLLM.{name}.url missing/changed — the "
                  f"explicit-disable rationale must be re-reviewed: "
                  f"{url or '<absent>'}"
              )

          url_re = re.compile(r"https?://([^/\s\"']+)")
          loopback_re = re.compile(r"^(127\.0\.0\.1|localhost)(:\d+)?$")
          hosts = []

          def collect(node):
              if isinstance(node, dict):
                  for value in node.values():
                      collect(value)
              elif isinstance(node, list):
                  for value in node:
                      collect(value)
              elif isinstance(node, str):
                  hosts.extend(url_re.findall(node))

          # Only the ACTIVE provider surface: the selected module instance of
          # each cognitive layer. Inactive upstream defaults may legitimately
          # carry external URLs — they are never instantiated.
          for module in ("VAD", "ASR", "LLM", "TTS"):
              collect(effective[module][effective["selected_module"][module]])
          bad = [h for h in hosts if not loopback_re.match(h)]
          assert not bad, f"active provider surface has non-loopback endpoints: {bad}"
          print("effective merged config OK (explicit map, VLLM unselected, loopback-only active surface, upstream external VLLM defaults pinned)")
          PY

      - name: Real-ASR tier (E2E-05) — effective merged config scan (render only; NO boot, NO vendor network)
        shell: bash
        run: |
          set -euo pipefail
          # E2E-05 (issue #55): prove what the reviewed real-ASR tier would be
          # EFFECTIVE at runtime (upstream recursive merge), fail-closed on
          # pin drift — WITHOUT booting it: no server start, no dashscope
          # connection, no credential beyond a dummy CI value.
          work="$(mktemp -d)"
          cp xiaozhi-smoke.env "${work}/asr.env"
          printf 'XIAOZHI_ASR_API_KEY=dummy-ci-not-a-real-key\n' >> "${work}/asr.env"
          chmod 600 "${work}/asr.env"
          python3 deploy/xiaozhi/render_config.py \
            --template deploy/xiaozhi/config/gateway-asr-real.yaml \
            --env-file "${work}/asr.env" --output "${work}/asr-overlay.yaml"
          ASR_OVERLAY="${work}/asr-overlay.yaml" "$RUNNER_TEMP/xiaozhi-esp32-server/venv/bin/python" - <<'PY'
          import os
          import re
          import yaml

          server_root = os.path.join(
              os.environ["RUNNER_TEMP"], "xiaozhi-esp32-server", "main", "xiaozhi-server"
          )

          def merge(defaults, overlay):
              # Same pinned-commit mirror as the gateway-minimal scan above
              # (upstream config_loader.merge_configs: recursive dict merge,
              # overlay wins). Re-verify on any future pin bump.
              if not isinstance(defaults, dict) or not isinstance(overlay, dict):
                  return overlay
              merged = dict(defaults)
              for key, value in overlay.items():
                  if isinstance(merged.get(key), dict) and isinstance(value, dict):
                      merged[key] = merge(merged[key], value)
                  else:
                      merged[key] = value
              return merged

          with open(os.path.join(server_root, "config.yaml"), encoding="utf-8") as fh:
              upstream = yaml.safe_load(fh)
          with open(os.environ["ASR_OVERLAY"], encoding="utf-8") as fh:
              overlay = yaml.safe_load(fh)
          effective = merge(upstream, overlay)

          expected = {
              "VAD": "SileroVAD",
              "ASR": "AliyunBLStreamASR",
              "LLM": "OllamaLLM",
              "TTS": "CustomTTS",
              "VLLM": "",
              "Memory": "nomem",
              "Intent": "nointent",
          }
          assert effective["selected_module"] == expected, effective["selected_module"]

          asr = effective["ASR"]["AliyunBLStreamASR"]
          assert asr["type"] == "aliyunbl_stream", asr
          assert asr["sample_rate"] == 16000 and asr["format"] == "pcm", asr
          # Comparison only — the dummy value is never printed.
          assert asr["api_key"] == "dummy-ci-not-a-real-key", "render-time injection failed"
          assert effective["log"]["log_level"] == "WARNING", effective["log"]
          assert effective["delete_audio"] is True
          assert effective["read_config_from_api"] is False

          # Beyond the reviewed ASR vendor (whose endpoint lives in pinned
          # provider CODE, not config), every URL in the active provider
          # surface must still be loopback: LLM/TTS placeholders unchanged.
          url_re = re.compile(r"https?://([^/\s\"']+)")
          loopback_re = re.compile(r"^(127\.0\.0\.1|localhost)(:\d+)?$")
          hosts = []

          def collect(node):
              if isinstance(node, dict):
                  for value in node.values():
                      collect(value)
              elif isinstance(node, list):
                  for value in node:
                      collect(value)
              elif isinstance(node, str):
