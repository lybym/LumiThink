name: R0 zero-skip gate

# R0-02 (Issue #8): the DSH SDK E2E / negative-permission evidence must run for
# real, with zero skips, on both Linux and Windows before an R0 change can be
# merged. Any missing/empty/unparseable report, any skip, and any unexpected
# egress to a non-loopback model endpoint fails the gate closed.
#
# E2E-02 (Issue #52): the `e2e02` job runs the REAL DSH runtime acceptance on
# Linux CI — a genuine `dsh-v0.2.0-rc.2` Cordis process (profile
# `lumi-dsh-runtime-bridge`) behind the BridgeAgentPort adapter, with the
# loopback mock model, three-round streaming, real cancellation, worker crash
# and whenIdle-hang isolation, negative permissions, and its own zero-skip
# JUnit report gate (`reports/e2e02-bridge.xml`).
#
# E2E-03 (Issue #53): the `e2e03` job runs the REAL DSH runtime's model route
# through the loopback Model Gateway egress proxy (host-side Model Gateway +
# `http_messages` provider against a loopback synthetic vendor). No real
# provider credential exists in CI and no non-loopback egress path is created
# — the real-provider evidence run stays an explicit operator opt-in
# (`test:e2e03:real`).
on:
  pull_request:
    paths:
      - 'poc/dsh-child/**'
      - '.github/workflows/r0-zero-skip-gate.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - 'poc/dsh-child/**'
      - '.github/workflows/r0-zero-skip-gate.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

# Minimal token: the gate only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: r0-zero-skip-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact pinned toolchain (Issue #8 AC-A/AC-D). pnpm 11 changes install and
  # lockfile semantics, so the baseline is pinned to the pnpm 10 line.
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '10.34.7'
  # Synthetic-only model route: no real provider credential is ever provided.
  DEEPSEEK_API_KEY: 'dsh-poc-synthetic-key'
  CI: 'true'
  # The child runtime must never read a developer's real Harness home.
  DSH_HOME: ${{ github.workspace }}/.r0-ci/dsh-home

jobs:
  r0:
    name: R0 acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_node="$(node --version)"
          actual_pnpm="$(pnpm --version)"
          echo "node=${actual_node} pnpm=${actual_pnpm}"
          if [ "${actual_node}" != "v${NODE_VERSION}" ]; then
            echo "::error::Node ${actual_node} is not the pinned v${NODE_VERSION}"
            exit 1
          fi
          if [ "${actual_pnpm}" != "${PNPM_VERSION}" ]; then
            echo "::error::pnpm ${actual_pnpm} is not the pinned ${PNPM_VERSION}"
            exit 1
          fi

      - name: Prepare isolated DSH_HOME
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${DSH_HOME}"
          mkdir -p "${DSH_HOME}"
          echo "DSH_HOME=${DSH_HOME}"

      - name: Report the runner identity and isolated home
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS} runner_arch=${RUNNER_ARCH} runner_temp=${RUNNER_TEMP:-unset}"
          echo "isolated_dsh_home=${DSH_HOME}"
          echo "workspace=$(pwd)"

      - name: Frozen-lockfile install
        working-directory: poc/dsh-child
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: poc/dsh-child
        run: pnpm run typecheck

      - name: R0 test suite (JUnit report + spec output)
        id: r0_tests
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:r0:run

      - name: Attach the report contract and enforce the zero-skip gate
        id: r0_gate
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:r0:gate

      - name: Prove the gate itself fails closed
        id: r0_gate_tests
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:r0:gate-tests

      - name: Enforce the unexpected-egress guard
        id: r0_egress
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:r0:egress

      - name: Write a sanitized diagnostics summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:-/tmp}/r0-diagnostics.txt"
          {
            echo "os=${RUNNER_OS}"
            echo "runner_image=${ImageOS:-unknown}"
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "git_sha=${GITHUB_SHA}"
            echo "dsh_home=${DSH_HOME}"
            echo "vcs_ref=${GITHUB_REF}"
          } > "${out}"
          cat "${out}"

      - name: Sanitize the JUnit artifact (strip absolute paths)
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        run: pnpm run test:r0:sanitize

      - name: Upload sanitized report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-acceptance-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            poc/dsh-child/reports/r0-01-acceptance.sanitized.xml
            ${{ runner.temp }}/r0-diagnostics.txt

      - name: Fail the job if any gate step failed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          report() {
            if [ "$2" != "success" ]; then
              echo "::error::R0 gate step '$1' concluded '$2'"
              status=1
            fi
          }
          report "R0 test suite" "${{ steps.r0_tests.outcome }}"
          report "report contract + zero-skip report gate" "${{ steps.r0_gate.outcome }}"
          report "gate fail-closed self-tests" "${{ steps.r0_gate_tests.outcome }}"
          report "unexpected-egress guard" "${{ steps.r0_egress.outcome }}"
          exit "${status}"

  e2e02:
    name: E2E-02 real DSH runtime (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_node="$(node --version)"
          actual_pnpm="$(pnpm --version)"
          echo "node=${actual_node} pnpm=${actual_pnpm}"
          if [ "${actual_node}" != "v${NODE_VERSION}" ]; then
            echo "::error::Node ${actual_node} is not the pinned v${NODE_VERSION}"
            exit 1
          fi
          if [ "${actual_pnpm}" != "${PNPM_VERSION}" ]; then
            echo "::error::pnpm ${actual_pnpm} is not the pinned ${PNPM_VERSION}"
            exit 1
          fi

      - name: Prepare isolated DSH_HOME
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${DSH_HOME}"
          mkdir -p "${DSH_HOME}"
          echo "DSH_HOME=${DSH_HOME}"

      - name: Frozen-lockfile install
        working-directory: poc/dsh-child
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: poc/dsh-child
        run: pnpm run typecheck

      - name: E2E-02 real-runtime suite (JUnit report + spec output)
        id: e2e02_tests
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:e2e02:run

      - name: Attach the report contract and enforce the zero-skip gate
        id: e2e02_gate
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:e2e02:gate

      - name: Sanitize the JUnit artifact (strip absolute paths)
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        run: pnpm run test:e2e02:sanitize

      - name: Upload sanitized E2E-02 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e02-bridge-acceptance
          if-no-files-found: warn
          retention-days: 14
          path: poc/dsh-child/reports/e2e02-bridge.sanitized.xml

      - name: Fail the job if any E2E-02 gate step failed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          report() {
            if [ "$2" != "success" ]; then
              echo "::error::E2E-02 gate step '$1' concluded '$2'"
              status=1
            fi
          }
          report "E2E-02 real-runtime suite" "${{ steps.e2e02_tests.outcome }}"
          report "E2E-02 zero-skip report gate" "${{ steps.e2e02_gate.outcome }}"
          exit "${status}"

  e2e03:
    name: E2E-03 gateway-routed model path (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          actual_node="$(node --version)"
          actual_pnpm="$(pnpm --version)"
          echo "node=${actual_node} pnpm=${actual_pnpm}"
          if [ "${actual_node}" != "v${NODE_VERSION}" ]; then
            echo "::error::Node ${actual_node} is not the pinned v${NODE_VERSION}"
            exit 1
          fi
          if [ "${actual_pnpm}" != "${PNPM_VERSION}" ]; then
            echo "::error::pnpm ${actual_pnpm} is not the pinned ${PNPM_VERSION}"
            exit 1
          fi

      - name: Prove the CI mock-only contract before installing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${LUMITHINK_MODEL_ROUTE:-}" ]; then
            echo "::error::LUMITHINK_MODEL_ROUTE must stay unset in the E2E-03 gate (CI is all-mock)"
            exit 1
          fi
          if [ -n "${LUMITHINK_MODEL_PROVIDER_KEY:-}" ]; then
            echo "::error::LUMITHINK_MODEL_PROVIDER_KEY must stay unset in the E2E-03 gate"
            exit 1
          fi
          if [ -n "${LUMITHINK_E2E03_REAL:-}" ]; then
            echo "::error::LUMITHINK_E2E03_REAL must stay unset in the E2E-03 gate"
            exit 1
          fi
          echo "mock-only CI confirmed: no real-provider activation variables"

      - name: Prepare isolated DSH_HOME
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${DSH_HOME}"
          mkdir -p "${DSH_HOME}"
          echo "DSH_HOME=${DSH_HOME}"

      - name: Frozen-lockfile install
        working-directory: poc/dsh-child
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: poc/dsh-child
        run: pnpm run typecheck

      - name: E2E-03 gateway-route suite (JUnit report + spec output)
        id: e2e03_tests
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:e2e03:run

      - name: Attach the report contract and enforce the zero-skip gate
        id: e2e03_gate
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        continue-on-error: true
        run: pnpm run test:e2e03:gate

      - name: Sanitize the JUnit artifact (strip absolute paths)
        if: ${{ !cancelled() }}
        working-directory: poc/dsh-child
        run: pnpm run test:e2e03:sanitize

      - name: Upload sanitized E2E-03 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e03-gateway-acceptance
          if-no-files-found: warn
          retention-days: 14
          path: poc/dsh-child/reports/e2e03-gateway.sanitized.xml

      - name: Fail the job if any E2E-03 gate step failed
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          report() {
            if [ "$2" != "success" ]; then
              echo "::error::E2E-03 gate step '$1' concluded '$2'"
              status=1
            fi
          }
          report "E2E-03 gateway-route suite" "${{ steps.e2e03_tests.outcome }}"
          report "E2E-03 zero-skip report gate" "${{ steps.e2e03_gate.outcome }}"
          exit "${status}"