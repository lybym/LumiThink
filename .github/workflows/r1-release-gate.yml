name: R1 release gate

# R1-10 (issue #22): the R1 release gate composes with — and never weakens —
# the existing gates:
#   - r0-zero-skip-gate.yml   (R0 PoC 35/35 0-SKIP, ubuntu+windows) — untouched;
#   - r1-baseline-gate.yml    (frozen install / typecheck / unit / build / boot);
#   - r1-deployment-gate.yml  (deploy artifacts + Linux deployment smoke).
# THIS workflow adds the release-level evidence:
#   1. release-eval-manifest — the child professional & safety evaluation
#      suites through the real harness, the release manifest drift gate
#      (version/schema/dependency/deploy-artifact drift auto-blocks), and the
#      credential/child-data leak scan over the gate artifacts;
#   2. web-mock-e2e — the Web UI contract over real HTTP with the mock
#      provider (loopback-only: live zero-egress sampling across the whole
#      traffic window with a self-test-pinned detector, no real child data,
#      no provider credentials);
#   3. upgrade-rollback-drill — the synthetic drill AC 2 demands: deploy
#      version N on an empty host, upgrade to N+1, roll back to N, all
#      sharing one encrypted snapshot, with a dependency-drift fail-closed
#      guard and a non-reversible-migration risk assessment in the report.
# Manual staging→approval→release→rollback gates live in docs/RELEASE_GATE.md.

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'app/**'
      - 'middleware.ts'
      - 'prisma/**'
      - 'scripts/**'
      - 'release/**'
      - 'deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/release/**'
      - '.github/workflows/r1-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'app/**'
      - 'middleware.ts'
      - 'prisma/**'
      - 'scripts/**'
      - 'release/**'
      - 'deploy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/release/**'
      - '.github/workflows/r1-release-gate.yml'
  workflow_dispatch:

# Minimal token: the gate only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: r1-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pinned toolchain as the other R1/R0 gates.
  NODE_VERSION: '24.21.0'
  PNPM_VERSION: '10.34.7'
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  # -------------------------------------------------------------------------
  # Job 1: release evaluations + release manifest gate + leak scan.
  # -------------------------------------------------------------------------
  release-eval-manifest:
    name: Release evals + manifest gate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          [ "$(node --version)" = "v${NODE_VERSION}" ]
          [ "$(pnpm --version)" = "${PNPM_VERSION}" ]

      - name: Prove the clean-environment contract (no real credentials/data)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL must stay unset in the release gate"
            exit 1
          fi
          for key in DEEPSEEK_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "::error::${key} must stay unset in the release gate (no real provider credentials in CI)"
              exit 1
            fi
          done
          echo "clean environment confirmed: no DATABASE_URL, no provider keys, no real child data"

      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run the release evaluation suites (child professional & safety)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-gate/cli.ts run-evals \
            --out "${RUNNER_TEMP}/r1-eval-reports"

      - name: Write the per-run release manifest record (app version + commit)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-gate/cli.ts manifest \
            --out "${RUNNER_TEMP}/r1-release-manifest.json" \
            --commit "${GITHUB_SHA}"
          cat "${RUNNER_TEMP}/r1-release-manifest.json"

      - name: Enforce the release manifest + report gate (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-gate/cli.ts verify \
            --baseline release/release-manifest.json \
            --reports "${RUNNER_TEMP}/r1-eval-reports"

      - name: Upload sanitized release evidence (content-free reports + manifest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-release-eval-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/r1-eval-reports/*.report.json
            ${{ runner.temp }}/r1-release-manifest.json

  # -------------------------------------------------------------------------
  # Job 2: Web Mock E2E over real HTTP (mock provider, zero egress).
  # -------------------------------------------------------------------------
  web-mock-e2e:
    name: Web mock E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          [ "$(node --version)" = "v${NODE_VERSION}" ]
          [ "$(pnpm --version)" = "${PNPM_VERSION}" ]

      - name: Prove the clean-environment contract (no real credentials/data)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL must stay unset in the web mock E2E"
            exit 1
          fi
          for key in DEEPSEEK_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!key:-}" ]; then
              echo "::error::${key} must stay unset in the web mock E2E"
              exit 1
            fi
          done
          echo "clean environment confirmed"

      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Boot the web app on loopback (mock provider by default)
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3123
          node --experimental-strip-types scripts/check-startup-env.ts
          node_modules/.bin/next start -H 127.0.0.1 -p 3123 > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3123/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "server healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server did not become healthy"
          tail -50 server.log
          exit 1

      - name: Web mock E2E round-trip over real HTTP + live zero-egress observation
        shell: bash
        run: |
          set -euo pipefail
          server_pid="$(cat server.pid)"
          cat > /tmp/r1-web-e2e.mjs <<'E2E'
          const base = "http://127.0.0.1:3123";
          const fail = (message) => {
            console.error("::error::" + message);
            process.exit(1);
          };

          const health = await fetch(base + "/api/health");
          if (!health.ok) fail("health endpoint not ok");
          const healthBody = await health.json();
          if (healthBody.status !== "ok") fail("health status not ok");
          if (healthBody.legacyDomainGuard !== "armed") fail("legacy domain guard not armed");

          const body = (id, text) => ({
            protocolVersion: "1.0",
            interaction: {
              kind: "text",
              clientRequestId: id,
              text: { content: text, format: "plain" },
              clientContext: { client: "web", clientVersion: "2.0.0-web" },
            },
          });
          const post = (payload) =>
            fetch(base + "/api/v1/interactions", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload),
            });

          // 1. Submit a synthetic child turn → structured ack.
          const first = await post(
            body("req_e2e00000001", "[synthetic] 今天数学作业有点难，可以陪我一起开始吗"),
          );
          if (first.status !== 200) fail("submit did not return 200");
          const ack = await first.json();
          if (ack.status !== "accepted") fail("ack status not accepted");
          if (ack.protocolVersion !== "1.0") fail("ack protocolVersion is not 1.0");
          if (typeof ack.streamUrl !== "string" || ack.streamUrl.indexOf("/api/v1/interactions/") !== 0) {
            fail("ack streamUrl malformed");
          }
          if (typeof ack.cancelUrl !== "string" || ack.cancelUrl.indexOf("/api/v1/interactions/") !== 0) {
            fail("ack cancelUrl malformed");
          }

          // 2. Coherent SSE round-trip: started → deltas → completed → end.
          const stream = await fetch(base + ack.streamUrl, {
            headers: { accept: "text/event-stream" },
          });
          if (!stream.ok) fail("event stream not ok");
          const raw = await stream.text();
          const frames = raw
            .split("\n\n")
            .map((chunk) => {
              const line = chunk.split("\n").find((candidate) => candidate.startsWith("data: "));
              return line === undefined ? null : JSON.parse(line.slice(6));
            })
            .filter((frame) => frame !== null);
          if (frames.length < 4) fail("event stream too short");
          if (frames[0].kind !== "stream.started") fail("first frame is not stream.started");
          if (frames[frames.length - 1].kind !== "stream.end") fail("last frame is not stream.end");
          const deltas = frames.filter((frame) => frame.kind === "agent.delta");
          if (deltas.length < 1) fail("no agent.delta frames");
          const completed = frames.find((frame) => frame.kind === "agent.completed");
          if (completed === undefined) fail("no agent.completed frame");
          if (completed.payload.type !== "completed" || completed.payload.response.status !== "completed") {
            fail("turn did not complete");
          }
          const joined = deltas
            .map((frame) => (frame.payload.type === "delta" ? frame.payload.text : ""))
            .join("");
          const completedText =
            completed.payload.response.content === null ? "" : completed.payload.response.content.text;
          if (joined !== completedText) fail("streamed deltas do not equal the completed content");

          // 3. Forged actor identity is rejected fail-closed (no echo).
          const forged = body("req_e2e00000002", "[synthetic] 你好");
          forged.interaction.actor = { role: "child", actorId: "act_impersonate1" };
          const forgedRes = await post(forged);
          if (forgedRes.status !== 403) fail("forged actor was not rejected with 403");
          const forgedBody = await forgedRes.json();
          if (forgedBody.error === undefined || forgedBody.error.code !== "CONTRACT_UNTRUSTED_IDENTITY") {
            fail("forged actor error code mismatch");
          }
          if (JSON.stringify(forgedBody).indexOf("impersonate") !== -1) {
            fail("the forged identity was echoed back");
          }

          // 4a. Mid-flight cancel pins the POSITIVE case (round 1 review
          // P2-3): the turn is cancelled WITHOUT consuming its stream, so
          // the request lands while the server still streams. The mock
          // provider's gate-approved text is emitted as 12-code-point
          // fragments with a 30 ms inter-frame delay (interaction-service
          // presentation pacing), so the turn stays in the "running" state
          // for hundreds of ms while a localhost cancel round-trip takes
          // ~1 ms — the "cancelled" outcome is deterministic, not a race.
          // (The abort paths themselves are additionally proven by
          // tests/server/interaction-endpoint.spec.ts.)
          const second = await post(body("req_e2e00000003", "[synthetic] 给我讲一个长一点的小故事吧"));
          if (second.status !== 200) fail("second submit did not return 200");
          const ack2 = await second.json();
          const cancelRunningRes = await fetch(base + ack2.cancelUrl, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              protocolVersion: "1.0",
              turnId: ack2.turnId,
              conversationId: ack2.conversationId,
              reason: "user_stop",
            }),
          });
          if (cancelRunningRes.status !== 200) fail("mid-flight cancel did not return 200");
          const cancelRunningBody = await cancelRunningRes.json();
          if (cancelRunningBody.status !== "cancelled") {
            fail("mid-flight cancel did not report 'cancelled': " + cancelRunningBody.status);
          }
          if (cancelRunningBody.protocolVersion !== "1.0" || cancelRunningBody.turnId !== ack2.turnId || cancelRunningBody.conversationId !== ack2.conversationId) {
            fail("mid-flight cancel result does not echo the request identity");
          }

          // 4b. Cancelling an ALREADY-ENDED turn answers 200 with a
          // structured terminal result echoing the request identity — the
          // safe no-op CONTRACT. With the recording switch OFF (the demo
          // default) an ended turn is purged from the turn index
          // (interaction-service endStream), so this honestly reports the
          // indistinguishable "unknown_turn" ("already_final" if the turn
          // is still indexed); which one appears is demo-mode-dependent
          // and this assertion pins the contract, not that race.
          const cancelEndedRes = await fetch(base + ack2.cancelUrl, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              protocolVersion: "1.0",
              turnId: ack2.turnId,
              conversationId: ack2.conversationId,
              reason: "user_stop",
            }),
          });
          if (cancelEndedRes.status !== 200) fail("ended-turn cancel did not return 200");
          const cancelEndedBody = await cancelEndedRes.json();
          if (
            cancelEndedBody.status !== "already_final" &&
            cancelEndedBody.status !== "unknown_turn"
          ) {
            fail("ended-turn cancel status unexpected: " + cancelEndedBody.status);
          }
          if (cancelEndedBody.protocolVersion !== "1.0" || cancelEndedBody.turnId !== ack2.turnId || cancelEndedBody.conversationId !== ack2.conversationId) {
            fail("ended-turn cancel result does not echo the request identity");
          }

          // 5. Idempotent replay returns the duplicate ack.
          const replay = await post(
            body("req_e2e00000001", "[synthetic] 今天数学作业有点难，可以陪我一起开始吗"),
          );
          if (replay.status !== 200) fail("replay did not return 200");
          const replayBody = await replay.json();
          if (replayBody.status !== "duplicate") fail("replay status is not duplicate");
          if (replayBody.turnId !== ack.turnId) fail("replay turn id mismatch");

          console.log(
            "web mock E2E OK: health, ack, coherent SSE round-trip, forged-actor 403, mid-flight cancel (cancelled), ended-turn cancel, idempotent replay",
          );
          E2E
          # ----------------------------------------------------------------
          # Zero-egress evidence (round 1 review P1-1 root-cause fix). The
          # previous pattern `pid=(${server_pid},${child_pids}),` was ONE
          # POSIX-ERE group — it could never match ss's one-pid-per-line
          # output, so the old check was vacuously true (always "zero
          # egress confirmed"). The rework below:
          #   1. matches pids EXACTLY: every pid=<n> occurrence in a line
          #      must be one of the app process-tree pids (a set lookup —
          #      no regex group/alternation semantics involved);
          #   2. treats loopback as 127.0.0.0/8 OR ::1 OR IPv4-mapped
          #      ::ffff:127.0.0.0/8 (the old filter only knew 127.0.0.1);
          #   3. samples `ss -tnpH` DURING the whole E2E traffic window at
          #      10 Hz plus one final post-traffic sweep — transient
          #      connections are now observable, not just an after-the-fact
          #      single sample;
          #   4. embeds a self-test that feeds fixed synthetic ss lines
          #      through the SAME detector: the two tree-owned REAL-egress
          #      lines MUST be caught (exactly the case the vacuous pattern
          #      missed, empirically shown by the round 1 review) while the
          #      loopback v4/v6/mapped and foreign-pid lines MUST stay
          #      clean — the detector cannot silently regress without
          #      failing this step.
          # Chosen mechanism (disclosed): observation, NOT an nftables/
          # iptables OUTPUT block — the hosted runner agent shares the job
          # user, so a uid-scoped OUTPUT block would sever the runner's own
          # control/artifact channel, and per-process network rules are not
          # reliably available on hosted runners. Residual gap (disclosed):
          # a connection opened AND closed entirely between two 10 Hz
          # samples, or by a tree pid that exited before the post-traffic
          # collection, is not observable. The mock provider is
          # local_no_egress by construction; this step is the runner-level
          # observation evidence on top of that design guarantee.
          # ----------------------------------------------------------------
          cat > /tmp/r1-egress-detector.mjs <<'DETECTOR'
          // Zero-egress detector for `ss -tnpH` output (P1-1 root-cause fix).
          // Usage: node r1-egress-detector.mjs <comma-separated tree pids> < samples.txt
          // Prints every violating line (empty output = zero egress observed).
          import { createInterface } from "node:readline";
          const treePids = new Set(
            (process.argv[2] ?? "")
              .split(",")
              .map((pid) => pid.trim())
              .filter((pid) => pid !== ""),
          );
          if (treePids.size === 0) {
            console.error("::error::egress detector called with an empty pid set");
            process.exit(1);
          }
          const isLoopback = (address) =>
            address.startsWith("127.") ||
            address.startsWith("[::1]") ||
            address.startsWith("[::ffff:127.");
          const rl = createInterface({ input: process.stdin });
          for await (const line of rl) {
            const fields = line.trim().split(/\s+/);
            if (fields.length < 5) continue;
            const state = fields[0];
            const local = fields[3];
            const peer = fields[4];
            if (state !== "ESTAB" && state !== "SYN-SENT") continue;
            const owned = [...line.matchAll(/pid=(\d+)/g)].some((match) => treePids.has(match[1]));
            if (!owned) continue;
            if (isLoopback(local) && isLoopback(peer)) continue;
            console.log(line);
          }
          DETECTOR

          # Embedded self-test: fixed synthetic samples, tree pids 1000+2000.
          cat > /tmp/r1-egress-selftest-samples.txt <<'SAMPLES'
          ESTAB      0      0 127.0.0.1:3123 127.0.0.1:55556 users:(("next-server (v15.4.2)",pid=1000,fd=28))
          ESTAB      0      0 [::1]:3123 [::1]:55557 users:(("next-server (v15.4.2)",pid=1000,fd=29))
          ESTAB      0      0 [::ffff:127.0.0.1]:3123 [::ffff:127.0.0.1]:55558 users:(("next-server (v15.4.2)",pid=1000,fd=31))
          ESTAB      0      0 192.0.2.10:45678 93.184.216.34:443 users:(("next-server (v15.4.2)",pid=2000,fd=45))
          ESTAB      0      0 10.1.2.3:45679 198.51.100.7:443 users:(("node",pid=1000,fd=12))
          ESTAB      0      0 192.0.2.10:45680 203.0.113.9:443 users:(("curl",pid=99999,fd=7))
          SAMPLES
          node /tmp/r1-egress-detector.mjs "1000,2000" < /tmp/r1-egress-selftest-samples.txt > /tmp/r1-egress-selftest-caught.txt
          caught_count="$(grep -c . /tmp/r1-egress-selftest-caught.txt || true)"
          if [ "${caught_count}" != "2" ]; then
            echo "::error::egress detector self-test failed: expected exactly 2 synthetic violations, caught ${caught_count}"
            cat /tmp/r1-egress-selftest-caught.txt
            exit 1
          fi
          grep -q 'pid=2000,' /tmp/r1-egress-selftest-caught.txt || {
            echo "::error::self-test: child-pid egress line not caught (the P1-1 vacuous-pattern regression)"
            exit 1
          }
          grep -q 'pid=1000,fd=12' /tmp/r1-egress-selftest-caught.txt || {
            echo "::error::self-test: server-pid egress line not caught"
            exit 1
          }
          if grep -Eq '127\.0\.0\.1:3123|::1|99999' /tmp/r1-egress-selftest-caught.txt; then
            echo "::error::self-test: loopback (v4/v6/mapped) or foreign-pid line wrongly flagged"
            cat /tmp/r1-egress-selftest-caught.txt
            exit 1
          fi
          echo "egress detector self-test OK: both tree-owned egress lines caught; loopback v4/v6/mapped and foreign-pid lines clean"

          # Sample `ss` DURING the whole E2E traffic window (10 Hz) and take
          # one final post-traffic sweep before judging every accumulated
          # sample with the detector above.
          samples="${RUNNER_TEMP}/r1-egress-samples.txt"
          : > "${samples}"
          (
            while :; do
              ss -tnpH 2>/dev/null >> "${samples}" || true
              sleep 0.1
            done
          ) &
          sampler_pid=$!
          e2e_failed=0
          node /tmp/r1-web-e2e.mjs || e2e_failed=1
          ss -tnpH 2>/dev/null >> "${samples}" || true
          kill "${sampler_pid}" 2>/dev/null || true
          wait "${sampler_pid}" 2>/dev/null || true

          # Collect the app process tree (server + ALL descendants) AFTER the
          # traffic — the most complete pid set — then judge every sample.
          tree_pids="${server_pid}"
          frontier="${server_pid}"
          while [ -n "${frontier}" ]; do
            next_frontier=""
            for p in ${frontier}; do
              for c in $(pgrep -P "${p}" 2>/dev/null || true); do
                case ",${tree_pids}," in
                  *",${c},"*) : ;;
                  *) tree_pids="${tree_pids},${c}"; next_frontier="${next_frontier} ${c}" ;;
                esac
              done
            done
            frontier="${next_frontier}"
          done
          violations="$(node /tmp/r1-egress-detector.mjs "${tree_pids}" < "${samples}")"
          if [ -n "${violations}" ]; then
            printf '%s\n' "${violations}"
            echo "::error::the app process tree opened a non-loopback connection during the E2E traffic window"
            exit 1
          fi
          echo "zero egress confirmed: $(wc -l < "${samples}") sampled socket lines across the whole E2E traffic window + final sweep (tree pids: ${tree_pids}; detector self-test pinned)"
          if [ "${e2e_failed}" = "1" ]; then
            echo "::error::web mock E2E failed"
            exit 1
          fi

      - name: Stop the web server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f server.pid ]; then
            kill -TERM "$(cat server.pid)" 2>/dev/null || true
          fi
          tail -20 server.log 2>/dev/null || true

  # -------------------------------------------------------------------------
  # Job 3: synthetic upgrade/rollback drill (AC 2).
  # Empty host → deploy N → upgrade N+1 → rollback N, one shared encrypted
  # snapshot, plus dependency-drift and state-schema risk assessment.
  # -------------------------------------------------------------------------
  upgrade-rollback-drill:
    name: Upgrade/rollback drill N→N+1→N (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (full history for the N/N+1 versions)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install exact Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Assert the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          [ "$(node --version)" = "v${NODE_VERSION}" ]
          [ "$(pnpm --version)" = "${PNPM_VERSION}" ]

      - name: Resolve drill versions N (base) and N+1 (head)
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse -q --verify 'HEAD^1' || git rev-parse 'HEAD~1')"
          if [ -z "${base_sha}" ]; then
            echo "::error::cannot resolve the base version for the drill"
            exit 1
          fi
          if [ "${base_sha}" = "${head_sha}" ]; then
            echo "::error::base and head are the same commit; the drill needs two versions"
            exit 1
          fi
          echo "drill versions: N=${base_sha} N+1=${head_sha}"
          {
            echo "DRILL_BASE_SHA=${base_sha}"
            echo "DRILL_HEAD_SHA=${head_sha}"
          } >> "$GITHUB_ENV"

      - name: Dependency drift guard (AC 1 — injected dependency drift fails closed)
        shell: bash
        run: |
          set -euo pipefail
          # The dependency SURFACE of the root package.json (deps, devDeps,
          # engines, packageManager) must be identical between N and N+1;
          # script-only package.json edits (e.g. test registration) do not
          # change the dependency surface and must not block the drill.
          git show "${DRILL_BASE_SHA}:package.json" > /tmp/pkg-n.json
          git show "${DRILL_HEAD_SHA}:package.json" > /tmp/pkg-n1.json
          dep_surface() {
            node -e "const p=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(JSON.stringify([p.dependencies??null,p.devDependencies??null,p.engines??null,p.packageManager??null]))" "$1"
          }
          if [ "$(dep_surface /tmp/pkg-n.json)" != "$(dep_surface /tmp/pkg-n1.json)" ]; then
            echo "::error::root package.json dependency surface (dependencies/devDependencies/engines/packageManager) drifted between N and N+1; a release with dependency drift requires the acknowledged release-manifest update and a reviewed drill"
            exit 1
          fi
          if ! git diff --exit-code "$DRILL_BASE_SHA" "$DRILL_HEAD_SHA" -- \
            pnpm-lock.yaml pnpm-workspace.yaml \
            poc/dsh-child/package.json poc/dsh-child/pnpm-lock.yaml; then
            echo "::error::dependency lockfiles or the PoC package manifest drifted between N and N+1; a release with dependency drift requires the acknowledged release-manifest update and a reviewed drill"
            exit 1
          fi
          echo "dependency surface identical between N and N+1 (lockfiles byte-identical; package.json script-only edits allowed)"

      - name: State-schema drift assessment (non-reversible migration risk)
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$DRILL_BASE_SHA" "$DRILL_HEAD_SHA" -- prisma/schema.prisma lib/server/snapshot || true)"
          if [ -n "${changed}" ]; then
            echo "${changed}"
            echo "STATE_SCHEMA_CHANGED=true" >> "$GITHUB_ENV"
            echo "::warning::state-schema surface changed between N and N+1 — rollback-to-N compatibility must be reviewed before release"
          else
            echo "STATE_SCHEMA_CHANGED=false" >> "$GITHUB_ENV"
            echo "state-schema surface unchanged between N and N+1"
          fi

      - name: Frozen-lockfile install (on the checked-out N+1 tree)
        run: pnpm install --frozen-lockfile

      - name: Write the drill report with the migration-risk assessment
        shell: bash
        run: |
          set -euo pipefail
          # The report and its leak scan run BEFORE the phases: they only
          # depend on the resolved SHAs + the assessment, and the scan needs
          # scripts/release-gate/ which exists on the N+1 tree but NOT on the
          # version-N tree the later phases check out. This file is the PLAN
          # + risk register; the ACTUAL per-phase execution outcomes are
          # appended by each phase step (one content-free JSON line each)
          # and merged into the final, self-contained report by the last
          # job step (round 1 review P2-1).
          # tri-state: the report must stay VALID JSON even when an earlier
          # step failed and the assessment never ran (null = not assessed).
          case "${STATE_SCHEMA_CHANGED:-unknown}" in
            true)  state_json='true';  risk='THIS RUN: the state-schema surface (prisma schema or lib/server/snapshot) changed between N and N+1 — rollback compatibility observed by this drill must be re-reviewed in the PR.' ;;
            false) state_json='false'; risk='THIS RUN: state-schema surface unchanged between N and N+1; rollback risk assessed low.' ;;
            *)     state_json='null';  risk='THIS RUN: the state-schema assessment did not run (an earlier drill step failed); rollback risk not assessed.' ;;
          esac
          {
            echo '{'
            echo '  "drill": "r1-upgrade-rollback-synthetic",'
            echo '  "issue": "https://github.com/lybym/LumiThink/issues/22",'
            echo "  \"baseSha\": \"${DRILL_BASE_SHA}\","
            echo "  \"headSha\": \"${DRILL_HEAD_SHA}\","
            echo '  "phases": ['
            echo '    { "phase": "N", "action": "empty-host deploy of the base version", "assertions": ["health ok", "demo default state", "mutation applied", "snapshot written"] },'
            echo '    { "phase": "N+1", "action": "upgrade on the same encrypted snapshot", "assertions": ["health ok", "N-era state survived", "snapshot_restored audited", "N+1-era mutation applied"] },'
            echo '    { "phase": "N-rollback", "action": "roll back to the base version", "assertions": ["health ok", "N+1-era state read back by N", "snapshot_restored audited"] }'
            echo '  ],'
            echo '  "dependencyDriftBetweenNAndHead": false,'
            echo "  \"stateSchemaChanged\": ${state_json},"
            echo '  "nonReversibleMigrationRisks": ['
            echo '    "Snapshot format is lumithink.runtime-snapshot/v1; this drill PROVES version N still reads the N+1-era snapshot. A future snapshot-format bump must keep the previous version able to read the old state (or explicitly declare rollback unsupported in docs/RELEASE_GATE.md §5) — the drill fails the moment N can no longer read the N+1 state.",'
            echo '    "Confirmed-change → snapshot write has a millisecond-level atomic-write window: a crash exactly inside it reverts that one change (disclosed in deploy/runbook.md §5). Not a data migration, but a rollback-semantics boundary.",'
            echo '    "Tombstone replay on restore (deploy/restore.sh marker) is intentionally irreversible — a restore re-applies deletions and never resurrects erased data (ADR-0005).",'
            echo '    "prisma/schema.prisma stays frozen (digest locked in release/release-manifest.json); SQLite persistence is deferred (TECH_STACK §3). Any schema change is a new data-modeling decision requiring migrations + migration tests before it can ship.",'
            echo "    \"${risk}\""
            echo '  ]'
            echo '}'
          } > "${RUNNER_TEMP}/r1-drill-report.json"
          # The report is a release artifact: it must be valid JSON.
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); console.log('drill report JSON OK')" "${RUNNER_TEMP}/r1-drill-report.json"
          cat "${RUNNER_TEMP}/r1-drill-report.json"

      - name: Scan the drill report for credential/child-data leaks
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-gate/cli.ts scan-leaks \
            --file "${RUNNER_TEMP}/r1-drill-report.json"

      - name: Upload the drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-upgrade-rollback-drill-report
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/r1-drill-report.json

      - name: 'Phase N — empty-host deploy of the base version'
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$DRILL_BASE_SHA"
          pnpm install --frozen-lockfile
          pnpm run build
          drill_dir="${RUNNER_TEMP}/lumithink-drill"
          rm -rf "${drill_dir}"
          mkdir -p "${drill_dir}"
          {
            echo "LUMITHINK_SNAPSHOT_PATH=${drill_dir}/snapshot.bin"
            echo "LUMITHINK_SNAPSHOT_KEY=$(openssl rand -hex 32)"
          } > "${RUNNER_TEMP}/drill.env"
          set -a; source "${RUNNER_TEMP}/drill.env"; set +a
          export PORT=3123
          node --experimental-strip-types scripts/check-startup-env.ts
          node_modules/.bin/next start -H 127.0.0.1 -p 3123 > drill-phase-n.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3123/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3123/api/health | grep -q '"status":"ok"' || {
            echo "::error::phase N: server did not become healthy"; tail -30 drill-phase-n.log; exit 1;
          }
          token="$(curl -fsS -X POST http://127.0.0.1:3123/api/v1/guardian/session \
            -H 'content-type: application/json' \
            -d '{"protocolVersion":"1.0","accessCode":"lumithink-guardian-demo"}' \
            | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>console.log(JSON.parse(d).sessionToken))')"
          status="$(curl -fsS http://127.0.0.1:3123/api/v1/guardian/authorizations -H "authorization: Bearer ${token}")"
          echo "${status}"
          echo "${status}" | grep -q '"switchId":"conversation_recording","enabled":false' || {
            echo "::error::phase N: the empty host must start from the demo default state"; exit 1;
          }
          curl -fsS -X POST http://127.0.0.1:3123/api/v1/guardian/authorizations \
            -H "authorization: Bearer ${token}" -H 'content-type: application/json' \
            -d '{"protocolVersion":"1.0","action":"set_feature_switch","switchId":"conversation_recording","enabled":true}' \
            | grep -q '"outcome":"applied"' || { echo "::error::phase N: mutation rejected"; exit 1; }
          test -s "${LUMITHINK_SNAPSHOT_PATH}" || { echo "::error::phase N: snapshot not written"; exit 1; }
          phase_n_digest="$(sha256sum "${LUMITHINK_SNAPSHOT_PATH}" | awk '{print $1}')"
          echo "phase N snapshot digest: ${phase_n_digest}"
          kill -TERM "${server_pid}"
          for _ in $(seq 1 20); do kill -0 "${server_pid}" 2>/dev/null || break; sleep 1; done
          echo "phase N (empty-host deploy) OK"
          # Executed-outcome line (content-free), merged into the final report.
          printf '%s\n' "{\"phase\":\"N\",\"action\":\"empty-host deploy of the base version\",\"outcome\":\"pass\",\"snapshotDigest\":\"${phase_n_digest}\"}" >> "${RUNNER_TEMP}/r1-drill-phase-outcomes.jsonl"

      - name: 'Phase N+1 — upgrade to the head version on the same state'
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$DRILL_HEAD_SHA"
          pnpm install --frozen-lockfile
          pnpm run build
          set -a; source "${RUNNER_TEMP}/drill.env"; set +a
          export PORT=3123
          node --experimental-strip-types scripts/check-startup-env.ts
          node_modules/.bin/next start -H 127.0.0.1 -p 3123 > drill-phase-n1.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3123/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3123/api/health | grep -q '"status":"ok"' || {
            echo "::error::phase N+1: server did not become healthy (upgrade could not read the N-era snapshot)"; tail -30 drill-phase-n1.log; exit 1;
          }
          token="$(curl -fsS -X POST http://127.0.0.1:3123/api/v1/guardian/session \
            -H 'content-type: application/json' \
            -d '{"protocolVersion":"1.0","accessCode":"lumithink-guardian-demo"}' \
            | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>console.log(JSON.parse(d).sessionToken))')"
          status="$(curl -fsS http://127.0.0.1:3123/api/v1/guardian/authorizations -H "authorization: Bearer ${token}")"
          echo "${status}"
          echo "${status}" | grep -q '"switchId":"conversation_recording","enabled":true' || {
            echo "::error::phase N+1: the N-era state did not survive the upgrade"; exit 1;
          }
          audit="$(curl -fsS http://127.0.0.1:3123/api/v1/guardian/audit -H "authorization: Bearer ${token}")"
          echo "${audit}" | grep -q '"kind":"snapshot_restored"' || {
            echo "::error::phase N+1: snapshot restore not disclosed in the audit ring"; exit 1;
          }
          curl -fsS -X POST http://127.0.0.1:3123/api/v1/guardian/authorizations \
            -H "authorization: Bearer ${token}" -H 'content-type: application/json' \
            -d '{"protocolVersion":"1.0","action":"set_feature_switch","switchId":"conversation_recording","enabled":false}' \
            | grep -q '"outcome":"applied"' || { echo "::error::phase N+1: mutation rejected"; exit 1; }
          phase_n1_digest="$(sha256sum "${LUMITHINK_SNAPSHOT_PATH}" | awk '{print $1}')"
          echo "phase N+1 snapshot digest: ${phase_n1_digest}"
          kill -TERM "${server_pid}"
          for _ in $(seq 1 20); do kill -0 "${server_pid}" 2>/dev/null || break; sleep 1; done
          echo "phase N+1 (upgrade preserves state) OK"
          printf '%s\n' "{\"phase\":\"N+1\",\"action\":\"upgrade on the same encrypted snapshot\",\"outcome\":\"pass\",\"snapshotDigest\":\"${phase_n1_digest}\"}" >> "${RUNNER_TEMP}/r1-drill-phase-outcomes.jsonl"

      - name: 'Phase N rollback — base version reads the N+1 state'
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$DRILL_BASE_SHA"
          pnpm install --frozen-lockfile
          pnpm run build
          set -a; source "${RUNNER_TEMP}/drill.env"; set +a
          export PORT=3123
          node --experimental-strip-types scripts/check-startup-env.ts
          node_modules/.bin/next start -H 127.0.0.1 -p 3123 > drill-phase-rollback.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3123/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3123/api/health | grep -q '"status":"ok"' || {
            echo "::error::rollback: version N could not boot on the N+1-era snapshot (non-reversible migration!)"; tail -30 drill-phase-rollback.log; exit 1;
          }
          token="$(curl -fsS -X POST http://127.0.0.1:3123/api/v1/guardian/session \
            -H 'content-type: application/json' \
            -d '{"protocolVersion":"1.0","accessCode":"lumithink-guardian-demo"}' \
            | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>console.log(JSON.parse(d).sessionToken))')"
          status="$(curl -fsS http://127.0.0.1:3123/api/v1/guardian/authorizations -H "authorization: Bearer ${token}")"
          echo "${status}"
          # The N+1-era confirmed change must be exactly what N reads back:
          # no resurrection, no silent loss, no format wall.
          echo "${status}" | grep -q '"switchId":"conversation_recording","enabled":false' || {
            echo "::error::rollback: version N did not read back the N+1-era state"; exit 1;
          }
          audit="$(curl -fsS http://127.0.0.1:3123/api/v1/guardian/audit -H "authorization: Bearer ${token}")"
          echo "${audit}" | grep -q '"kind":"snapshot_restored"' || {
            echo "::error::rollback: snapshot restore not disclosed in the audit ring"; exit 1;
          }
          phase_rollback_digest="$(sha256sum "${LUMITHINK_SNAPSHOT_PATH}" | awk '{print $1}')"
          echo "phase N rollback snapshot digest: ${phase_rollback_digest}"
          kill -TERM "${server_pid}"
          for _ in $(seq 1 20); do kill -0 "${server_pid}" 2>/dev/null || break; sleep 1; done
          echo "phase N rollback (state readable by N, no resurrection) OK"
          printf '%s\n' "{\"phase\":\"N-rollback\",\"action\":\"roll back to the base version\",\"outcome\":\"pass\",\"snapshotDigest\":\"${phase_rollback_digest}\"}" >> "${RUNNER_TEMP}/r1-drill-phase-outcomes.jsonl"

      - name: Compose the final drill report with the executed phase outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Round 1 review P2-1: the drill artifact must be SELF-CONTAINED
          # evidence. This step merges the executed per-phase outcomes into
          # the final report. Each phase appends its outcome line ONLY
          # after all its assertions passed; a missing line therefore means
          # that phase did not complete — visible in the artifact, never
          # hidden. The composer tolerates a missing outcomes file (the job
          # failed before any phase recorded an outcome) but not a
          # malformed line, and re-validates the composed JSON fail-closed.
          git switch --detach "$DRILL_HEAD_SHA"
          cat > /tmp/compose-drill-final.mjs <<'COMPOSER'
          import { readFileSync, writeFileSync } from "node:fs";
          const [baseFile, outcomesFile, outFile] = process.argv.slice(2, 5);
          const fail = (message) => {
            console.error("::error::" + message);
            process.exit(1);
          };
          if (baseFile === undefined || outcomesFile === undefined || outFile === undefined) {
            fail("composer requires the base report, outcomes file and output paths");
          }
          let base;
          try {
            base = JSON.parse(readFileSync(baseFile, "utf8"));
          } catch {
            fail("base drill report is missing or not valid JSON");
          }
          if (base === null || typeof base !== "object" || Array.isArray(base)) {
            fail("base drill report is not an object");
          }
          let raw = null;
          try {
            raw = readFileSync(outcomesFile, "utf8");
          } catch (error) {
            if (error.code !== "ENOENT") fail("phase outcomes file is unreadable");
          }
          const outcomes =
            raw === null
              ? []
              : raw
                  .split("\n")
                  .filter((line) => line.trim() !== "")
                  .map((line, index) => {
                    let value;
                    try {
                      value = JSON.parse(line);
                    } catch {
                      fail("phase outcome line " + (index + 1) + " is not valid JSON");
                    }
                    if (
                      value === null || typeof value !== "object" || Array.isArray(value) ||
                      typeof value.phase !== "string" || value.phase.length === 0 ||
                      value.outcome !== "pass" ||
                      (value.snapshotDigest !== undefined &&
                        !/^[0-9a-f]{64}$/.test(value.snapshotDigest))
                    ) {
                      fail("phase outcome line " + (index + 1) + " has an unexpected shape");
                    }
                    return value;
                  });
          const expectedPhases = ["N", "N+1", "N-rollback"];
          const final = {
            ...base,
            phaseOutcomes: outcomes,
            allPhasesPassed: expectedPhases.every((phase) =>
              outcomes.some((entry) => entry.phase === phase && entry.outcome === "pass"),
            ),
          };
          writeFileSync(outFile, JSON.stringify(final, null, 2) + "\n");
          JSON.parse(readFileSync(outFile, "utf8"));
          console.log(
            "final drill report composed: phaseOutcomes=" +
              outcomes.length +
              " allPhasesPassed=" +
              final.allPhasesPassed,
          );
          COMPOSER
          if ! node /tmp/compose-drill-final.mjs \
            "${RUNNER_TEMP}/r1-drill-report.json" \
            "${RUNNER_TEMP}/r1-drill-phase-outcomes.jsonl" \
            "${RUNNER_TEMP}/r1-drill-report-final.json"; then
            echo "::error::final drill report composition failed"
            exit 1
          fi
          # The final report is a release artifact like the base report:
          # it must pass the same leak scan (needs scripts/release-gate/,
          # which is why the tree is switched back to the N+1 HEAD above).
          node --experimental-strip-types scripts/release-gate/cli.ts scan-leaks \
            --file "${RUNNER_TEMP}/r1-drill-report-final.json"

      - name: Upload the final drill report (self-contained phase outcomes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-upgrade-rollback-drill-report-final
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/r1-drill-report-final.json

