# lumi-dsh-runtime-bridge — LumiThink E2E-02 (issue #52) bridge worker profile.
#
# Composition contract (issue #52 实施范围; docs/VOICE_RUNTIME.md §8/§15):
#   * This profile declares ZERO bundles; every service row below is the
#     complete, explicit allowlist for the REAL DSH process the bridge
#     adapter spawns. Nothing else may be mounted.
#   * Deliberately NOT mounted (each omission is a security decision):
#       - @deepseek-ai/dsh-sdk-app / dsh-sdk-jsonrpc-server (the Bridge owns
#         agent lifecycle in-process; no second lifecycle owner may exist)
#       - @deepseek-ai/dsh-session-log-deepseek  (session log upload)
#       - @deepseek-ai/dsh-plugin-package-inventory-deepseek (auto plugin install)
#       - @deepseek-ai/dsh-sandbox-local / dsh-sandbox-policy (danger-full-access)
#       - @deepseek-ai/dsh-subprocess-local / dsh-terminal / dsh-terminal-bash (PTY/Shell)
#       - @deepseek-ai/dsh-tool-bash-persistent / dsh-tool-pwsh-persistent (Shell tools)
#       - @deepseek-ai/dsh-mcp-resources / dsh-mcp-client (unrestricted MCP)
#       - any tool-fs / tool-web / tool-subagent providers (generic FS, HTTP fetch, subagents)
#       - feedback / product-telemetry-otel / session-telemetry-otel plugins
#   * The model adapter (llm-deepseek) routes ONLY to $DSH_POC_MOCK_BASE_URL
#     (the local synthetic Messages mock on loopback). If the variable is
#     absent the row falls back to the loopback discard port, which always
#     fails closed — it can never fall back to a public provider API.
#   * Safety invariants (dsh-invariants + the four subplugin invariants) are
#     kept from the upstream kernel and are non-negotiable.

- insert:
    # --- Model adapter (synthetic-only route) ---------------------------------
    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DSH_POC_MOCK_BASE_URL ?? 'http://127.0.0.1:9'
        reasoningEffort: 'off'
        defaultContextWindow: 32768
        streamIdleTimeoutMs: 60000

    # --- Agent kernel ----------------------------------------------------------
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: >-
          你是 LumiThink 合成测试环境中的 Bridge Agent（E2E-02，issue #52）。
          你明确标识自己是 AI，只进行文本对话；环境中没有注册任何工具，
          你不能执行命令、读写文件或访问网络。不要声称自己具有执行代码或访问文件系统的能力。

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    # --- Safety invariants (kept from the upstream kernel) ---------------------
    - id: invariants
      name: '@deepseek-ai/dsh-invariants'

    - id: session-invariant
      name: '@deepseek-ai/dsh-session/invariant'

    - id: agent-invariant
      name: '@deepseek-ai/dsh-agent/invariant'

    - id: scope-invariant
      name: '@deepseek-ai/dsh-scope/invariant'

    - id: agent-loop-invariant
      name: '@deepseek-ai/dsh-agent-loop/invariant'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    # --- Session persistence (isolated DSH_HOME only) --------------------------
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none
